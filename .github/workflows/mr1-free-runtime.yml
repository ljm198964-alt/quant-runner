name: MR1 Free Runtime

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'
  push:
    paths:
      - '.github/workflows/mr1-free-runtime.yml'
      - 'trigger/mr1_free_runtime.json'

permissions:
  contents: read

concurrency:
  group: totalcorner-api-runtime
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check required secrets
        shell: bash
        env:
          PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
          TOTALCORNER_TOKEN: ${{ secrets.TOTALCORNER_TOKEN }}
        run: |
          set -euo pipefail
          for v in PRIVATE_REPO_TOKEN TOTALCORNER_TOKEN; do
            if [ -z "${!v:-}" ]; then
              echo "::error::Missing required secret: $v"
              exit 2
            fi
          done

      - name: Checkout private MR1
        uses: actions/checkout@v4
        with:
          repository: ljm198964-alt/mr1-shadow
          ref: master
          fetch-depth: 0
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}

      - name: Checkout shared Chinese football registry
        uses: actions/checkout@v4
        with:
          repository: ljm198964-alt/totalcorner-research-bridge
          ref: master
          path: external/football-display-registry
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          sparse-checkout: |
            data/football_display_names
          sparse-checkout-cone-mode: true
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Record base
        run: echo "RUNTIME_BASE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Nonblocking MR1 Chinese delivery and historical edit regressions
        continue-on-error: true
        run: node --test test-v6-ah-formal.js test-v6-ah-display-repair-v5.js

      - name: MR1 API runtime
        env:
          TOTALCORNER_TOKEN: ${{ secrets.TOTALCORNER_TOKEN }}
          MR1_RUNTIME_EXECUTOR: PUBLIC_RUNNER
        run: node src/github-shadow-runtime.js

      - name: Persist MR1 state
        if: always()
        env:
          TOTALCORNER_TOKEN: ${{ secrets.TOTALCORNER_TOKEN }}
        run: node src/persist-github-state.js

      - name: Build V6 AH formal evaluation
        if: always()
        timeout-minutes: 2
        run: node src/v6-cross-market-forward.js

      - name: Settle existing MR1 V6 AH formal signals
        if: always()
        continue-on-error: true
        run: node src/v6-ah-formal-settlement.js

      - name: Deliver MR1 V6 AH formal signals
        if: always()
        continue-on-error: true
        env:
          MR1_TG_BOT_TOKEN: ${{ secrets.MR1_TG_BOT_TOKEN }}
          MR1_TG_CHAT_ID: ${{ secrets.MR1_TG_CHAT_ID }}
        run: node src/v6-ah-formal-notify.js

      - name: Repair existing MR1 messages to Chinese display
        env:
          MR1_TG_BOT_TOKEN: ${{ secrets.MR1_TG_BOT_TOKEN }}
          MR1_TG_CHAT_ID: ${{ secrets.MR1_TG_CHAT_ID }}
        run: node src/v6-ah-formal-display-repair.js

      - name: Persist formal V6 state
        if: always()
        env:
          TOTALCORNER_TOKEN: ${{ secrets.TOTALCORNER_TOKEN }}
        run: node src/persist-github-state.js