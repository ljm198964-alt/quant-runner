name: MR1 row schema audit once
on:
  push:
    paths:
      - '.github/workflows/mr1-row-schema-audit-once.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ljm198964-alt/mr1-shadow
          ref: master
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
      - name: Inspect saved rolling row schema
        run: |
          python3 - <<'PY'
          import json
          r=json.load(open('data/processed/rolling-evaluation-v2.json'))
          for m in ['AH','OU']:
              x=r['markets'][m].get('all_rows')
              out={'type':type(x).__name__}
              if isinstance(x,dict):
                  out['keys']=list(x.keys())
                  for k,v in x.items():
                      if isinstance(v,list) and v:
                          out['sample_list_key']=k;out['n']=len(v);out['row_keys']=list(v[0].keys());out['sample']=v[0];break
              elif isinstance(x,list):
                  out['n']=len(x);out['row_keys']=list(x[0].keys()) if x else [];out['sample']=x[0] if x else None
              print(m+'_ROW_SCHEMA='+json.dumps(out,separators=(',',':')))
          PY
