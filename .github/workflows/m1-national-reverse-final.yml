name: M1 national reverse final regression
on:
  push:
    paths:
      - '.github/workflows/m1-national-reverse-final.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ljm198964-alt/totalcorner-research-bridge
          ref: master
          fetch-depth: 0
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy scipy requests
      - name: Run national AH and OU reverse regression
        env:
          TOTALCORNER_TOKEN: TEST
        shell: bash
        run: |
          set +e
          python test_m1_national_reverse.py > /tmp/test.log 2>&1
          rc=$?
          set -e
          python - "$rc" <<'PY'
          import json,sys,pathlib
          rc=int(sys.argv[1])
          log=pathlib.Path('/tmp/test.log').read_text(errors='replace')[-8000:]
          pathlib.Path('results/m1_national_reverse_final_test.json').write_text(
              json.dumps({"status":"PASS" if rc==0 else "FAIL","rc":rc,"log":log,"telegram_real_send":False},ensure_ascii=False,indent=2)+"\n")
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add results/m1_national_reverse_final_test.json
          git commit -m 'Verify M1 national AH and OU reverse execution'
          git pull --rebase origin master
          git push origin HEAD:master
          test "$rc" -eq 0
