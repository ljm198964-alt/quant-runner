name: M3 Upstream Open-Source Research
concurrency:
  group: m3-research-${{ github.ref }}
  cancel-in-progress: false
on:
  workflow_dispatch:
  schedule:
    - cron: '20 */4 * * *'
  push:
    paths:
      - '.github/workflows/m3-independent-research.yml'
permissions:
  contents: write
jobs:
  upstream:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Checkout original Football Predictor V4
        uses: actions/checkout@v4
        with:
          repository: pkotengpoku/football-predictor
          path: upstream/football-predictor
          persist-credentials: false
      - name: Fix upstream requirements trailing escaped newline in checkout only
        working-directory: upstream/football-predictor
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("requirements.txt")
          old = p.read_text()
          if old.endswith(chr(92) + "n"):
              p.write_text(old[:-2] + chr(10))
              print("M3_UPSTREAM_REQUIREMENTS_EOF_FORMAT_REPAIRED")
          PY
      - name: Run V4 per original README
        id: v4
        working-directory: upstream/football-predictor
        shell: bash
        run: |
          python -m venv .venv
          source .venv/bin/activate
          pip install -r requirements.txt
          python run.py download --include-current
          python run.py features
          python run.py backtest
          echo '## Original Football Predictor V4 walk-forward metrics' >> "$GITHUB_STEP_SUMMARY"
          if [ -f reports/walk_forward_metrics.csv ]; then
            cat reports/walk_forward_metrics.csv >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Upstream reports/walk_forward_metrics.csv not produced' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
      - name: Install penaltyblog per original README
        shell: bash
        run: |
          python -m venv /tmp/m3-penaltyblog-venv
          source /tmp/m3-penaltyblog-venv/bin/activate
          pip install penaltyblog
          python -c 'import penaltyblog; print("penaltyblog import ok")'
      - name: Run strict UTC season-forward penaltyblog AH and OU evaluation
        shell: bash
        run: |
          source /tmp/m3-penaltyblog-venv/bin/activate
          python -m research.m3.penaltyblog_walkforward \
            --input-dir upstream/football-predictor/data/raw \
            --output-dir "$RUNNER_TEMP/m3-penaltyblog-oos" \
            --previous-meta research/m3/results/latest_penaltyblog_oos_report.json \
            --quant-runner-commit "$(git rev-parse HEAD)" \
            --upstream-commit "$(git -C upstream/football-predictor rev-parse HEAD)"
      - name: Save original V4 research outputs and source revision
        if: always()
        shell: bash
        run: |
          mkdir -p m3-run-metadata
          git -C upstream/football-predictor rev-parse HEAD > m3-run-metadata/football-predictor-commit.txt
          git rev-parse HEAD > m3-run-metadata/quant-runner-commit.txt
          date -u +%Y-%m-%dT%H:%M:%SZ > m3-run-metadata/recorded-utc.txt
          git -C upstream/football-predictor rev-parse HEAD > m3-run-metadata/football-predictor-commit.txt
          git rev-parse HEAD > m3-run-metadata/quant-runner-commit.txt
          if [ -f "$RUNNER_TEMP/m3-penaltyblog-oos/penaltyblog_oos_report.json" ]; then
            cp -R "$RUNNER_TEMP/m3-penaltyblog-oos" m3-run-metadata/
          fi
      - name: Preserve original V4 reports for future version comparisons
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m3-upstream-v4-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            upstream/football-predictor/reports/walk_forward_metrics.csv
            upstream/football-predictor/reports/walk_forward_predictions.csv
            upstream/football-predictor/reports/v4_subgroup_metrics.csv
            m3-run-metadata/m3-penaltyblog-oos/
            m3-run-metadata/
          if-no-files-found: warn
      - name: Persist M3 upstream V4 run receipt and raw metric report
        if: always()
        shell: bash
        env:
          V4_OUTCOME: ${{ steps.v4.outcome }}
        run: |
          python - <<'PY'
          from datetime import datetime, timezone
          from pathlib import Path
          import json, os
          root=Path('upstream/football-predictor')
          report=root/'reports/walk_forward_metrics.csv'
          oos=Path(os.environ.get('RUNNER_TEMP','/tmp'))/'m3-penaltyblog-oos'
          record={
            'protocol':'M3_UPSTREAM_RUN_RECEIPT_V1',
            'utc':datetime.now(timezone.utc).isoformat(),
            'workflow_run_id':os.getenv('GITHUB_RUN_ID'),
            'workflow_attempt':os.getenv('GITHUB_RUN_ATTEMPT'),
            'commit':os.getenv('GITHUB_SHA'),
            'v4_step_outcome':os.getenv('V4_OUTCOME'),
            'original_v4_metrics_available':report.exists(),
            'ah_trained':False,
            'penaltyblog_oos_report_available':(oos/'penaltyblog_oos_report.json').exists(),
            'crown_roi_claim':None,
            'telegram_sent':False,
          }
          out=Path('research/m3/results');out.mkdir(parents=True,exist_ok=True)
          if report.exists():
              (out/'latest_v4_original_metrics.csv').write_bytes(report.read_bytes())
          if (oos/'penaltyblog_oos_report.json').exists():
              oos_report=json.loads((oos/'penaltyblog_oos_report.json').read_text())
              record['ah_trained']=True
              record['penaltyblog_oos_report_available']=True
              record['penaltyblog_oos_prediction_rows']=oos_report.get('prediction_rows')
              record['penaltyblog_oos_input_fingerprint_sha256']=oos_report.get('input_fingerprint_sha256')
              record['penaltyblog_version']=oos_report.get('penaltyblog_version')
              record['penaltyblog_fitted_models_count']=oos_report.get('fitted_models_count')
              record['penaltyblog_model_parameters_sha256']=oos_report.get('model_parameters_sha256')
          else:
              record['penaltyblog_oos_report_available']=False
          (out/'latest_upstream_run.json').write_text(json.dumps(record,indent=2)+'\n')
          (out/'latest_m3_run.json').write_text(json.dumps(record,indent=2)+'\n')
          PY
          # Keep upstream results in a temporary copy while main can advance.
          mkdir -p "$RUNNER_TEMP/m3-receipt"
          cp research/m3/results/latest_upstream_run.json "$RUNNER_TEMP/m3-receipt/"
          if [ -f research/m3/results/latest_v4_original_metrics.csv ]; then
            cp research/m3/results/latest_v4_original_metrics.csv "$RUNNER_TEMP/m3-receipt/"
          fi
          if [ -f research/m3/results/latest_m3_run.json ]; then
            cp research/m3/results/latest_m3_run.json "$RUNNER_TEMP/m3-receipt/"
          fi
          if [ -d "$RUNNER_TEMP/m3-penaltyblog-oos" ]; then
            cp -R "$RUNNER_TEMP/m3-penaltyblog-oos" "$RUNNER_TEMP/m3-receipt/"
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for i in 1 2 3; do
            git fetch origin "$GITHUB_REF_NAME"
            git reset --hard "origin/$GITHUB_REF_NAME"
            history_dir="research/m3/results/history/$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
            mkdir -p "$history_dir"
            if [ -f "$RUNNER_TEMP/m3-receipt/latest_v4_original_metrics.csv" ]; then
              python research/m3/compare_upstream_snapshots.py \
                --previous research/m3/results/latest_v4_original_metrics.csv \
                --current "$RUNNER_TEMP/m3-receipt/latest_v4_original_metrics.csv" \
                --run-id "$GITHUB_RUN_ID" \
                --output "$history_dir/comparison.json"
            fi
            if [ -f "$RUNNER_TEMP/m3-receipt/m3-penaltyblog-oos/penaltyblog_oos_report.json" ]; then
              python research/m3/compare_penaltyblog_snapshots.py \
                --previous research/m3/results/latest_penaltyblog_oos_report.json \
                --current "$RUNNER_TEMP/m3-receipt/m3-penaltyblog-oos/penaltyblog_oos_report.json" \
                --output "$history_dir/penaltyblog_comparison.json"
            fi
            cp "$RUNNER_TEMP/m3-receipt/latest_upstream_run.json" research/m3/results/
            cp "$RUNNER_TEMP/m3-receipt/latest_upstream_run.json" "$history_dir/receipt.json"
            if [ -f "$RUNNER_TEMP/m3-receipt/latest_m3_run.json" ]; then
              cp "$RUNNER_TEMP/m3-receipt/latest_m3_run.json" research/m3/results/latest_m3_run.json
              cp "$RUNNER_TEMP/m3-receipt/latest_m3_run.json" "$history_dir/m3_run.json"
            fi
            if [ -f "$RUNNER_TEMP/m3-receipt/m3-penaltyblog-oos/penaltyblog_oos_report.json" ]; then
              cp "$RUNNER_TEMP/m3-receipt/m3-penaltyblog-oos/penaltyblog_oos_report.json" research/m3/results/latest_penaltyblog_oos_report.json
              cp "$RUNNER_TEMP/m3-receipt/m3-penaltyblog-oos/penaltyblog_oos_splits.json" research/m3/results/latest_penaltyblog_oos_splits.json
              cp "$RUNNER_TEMP/m3-receipt/m3-penaltyblog-oos/penaltyblog_oos_report.json" "$history_dir/penaltyblog_oos_report.json"
              cp "$RUNNER_TEMP/m3-receipt/m3-penaltyblog-oos/penaltyblog_oos_splits.json" "$history_dir/penaltyblog_oos_splits.json"
              prediction_sha="$(python -c 'import json,sys; print(json.load(open(sys.argv[1]))["predictions_sha256"])' "$RUNNER_TEMP/m3-receipt/m3-penaltyblog-oos/penaltyblog_oos_report.json")"
              mkdir -p research/m3/results/predictions
              if [ ! -f "research/m3/results/predictions/$prediction_sha.csv" ]; then
                cp "$RUNNER_TEMP/m3-receipt/m3-penaltyblog-oos/penaltyblog_oos_predictions.csv" "research/m3/results/predictions/$prediction_sha.csv"
              fi
              echo "Prediction artifact: research/m3/results/predictions/$prediction_sha.csv" > "$history_dir/prediction_artifact.txt"
              parameter_sha="$(python -c 'import json,sys; print(json.load(open(sys.argv[1]))["model_parameters_sha256"])' "$RUNNER_TEMP/m3-receipt/m3-penaltyblog-oos/penaltyblog_oos_report.json")"
              mkdir -p research/m3/results/model_parameters
              if [ ! -f "research/m3/results/model_parameters/$parameter_sha.json" ]; then
                cp "$RUNNER_TEMP/m3-receipt/m3-penaltyblog-oos/penaltyblog_oos_model_parameters.json" "research/m3/results/model_parameters/$parameter_sha.json"
              fi
              echo "Model parameter artifact: research/m3/results/model_parameters/$parameter_sha.json" > "$history_dir/model_parameter_artifact.txt"
            fi
            if [ -f "$RUNNER_TEMP/m3-receipt/latest_v4_original_metrics.csv" ]; then
              cp "$RUNNER_TEMP/m3-receipt/latest_v4_original_metrics.csv" research/m3/results/
              cp "$RUNNER_TEMP/m3-receipt/latest_v4_original_metrics.csv" research/m3/results/history/"$GITHUB_RUN_ID"-"$GITHUB_RUN_ATTEMPT"/original_v4_metrics.csv
            fi
            git add research/m3/results/history
            git add research/m3/results/latest_upstream_run.json
            git add research/m3/results/latest_m3_run.json "$history_dir"
            for latest in research/m3/results/latest_penaltyblog_oos_report.json research/m3/results/latest_penaltyblog_oos_splits.json; do
              if [ -f "$latest" ]; then git add "$latest"; fi
            done
            if [ -d research/m3/results/predictions ]; then git add research/m3/results/predictions; fi
            if [ -d research/m3/results/model_parameters ]; then git add research/m3/results/model_parameters; fi
            if [ -f research/m3/results/latest_v4_original_metrics.csv ]; then
              git add research/m3/results/latest_v4_original_metrics.csv
            fi
            if git diff --cached --quiet; then
              echo "M3_RECEIPT_ALREADY_RECORDED"
              exit 0
            fi
            git commit -m "Record independent M3 upstream execution receipt [skip ci]"
            if git push origin "HEAD:$GITHUB_REF_NAME"; then
              echo "M3_RECEIPT_PERSISTED"
              exit 0
            fi
            sleep "$((i * 2))"
          done
          echo "::error::M3_RECEIPT_PERSIST_FAILED"
          exit 1
      - name: M3 isolation statement
        run: echo 'Independent M3 research only; V4 OU original run and penaltyblog AH/OU sample-out evaluation; no M1/M2/MR1 ledgers, no Crown price substitution, no TG sent, no model promotion.'
