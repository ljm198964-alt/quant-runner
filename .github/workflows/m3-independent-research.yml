name: M3 Upstream Open-Source Research
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/m3-independent-research.yml'
permissions:
  contents: read
jobs:
  upstream:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Checkout original Football Predictor V4
        uses: actions/checkout@v4
        with:
          repository: pkotengpoku/football-predictor
          path: upstream/football-predictor
          persist-credentials: false
      - name: Run V4 per original README
        working-directory: upstream/football-predictor
        shell: bash
        run: |
          python -m venv .venv
          source .venv/bin/activate
          pip install -r requirements.txt
          python run.py download
          python run.py features
          python run.py backtest
          echo '## Original Football Predictor V4 walk-forward metrics' >> "$GITHUB_STEP_SUMMARY"
          if [ -f reports/walk_forward_metrics.csv ]; then
            cat reports/walk_forward_metrics.csv >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Upstream reports/walk_forward_metrics.csv not produced' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
      - name: Install penaltyblog per original README
        shell: bash
        run: |
          python -m venv /tmp/m3-penaltyblog-venv
          source /tmp/m3-penaltyblog-venv/bin/activate
          pip install penaltyblog
          python -c 'import penaltyblog; print("penaltyblog import ok")'
      - name: Save original V4 research outputs and source revision
        if: always()
        shell: bash
        run: |
          mkdir -p m3-run-metadata
          git -C upstream/football-predictor rev-parse HEAD > m3-run-metadata/football-predictor-commit.txt
          git rev-parse HEAD > m3-run-metadata/quant-runner-commit.txt
          date -u +%Y-%m-%dT%H:%M:%SZ > m3-run-metadata/recorded-utc.txt
      - name: Preserve original V4 reports for future version comparisons
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m3-upstream-v4-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            upstream/football-predictor/reports/walk_forward_metrics.csv
            upstream/football-predictor/reports/walk_forward_predictions.csv
            upstream/football-predictor/reports/v4_subgroup_metrics.csv
            m3-run-metadata/
          if-no-files-found: warn
      - name: M3 isolation statement
        run: echo 'Upstream OU V4 and penaltyblog install only; no M1/M2/MR1 ledgers, no Crown price substitution, no AH model trained, no TG sent.'
