name: MR1 AI Runtime

on:
  workflow_dispatch:
  # One-time hosted source verification; do not submit TG or market orders.
  push:
    paths:
      - '.github/workflows/mr1-ai-runtime.yml'

permissions:
  contents: read

concurrency:
  group: totalcorner-api-runtime
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check required secrets
        shell: bash
        env:
          PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
          TOTALCORNER_TOKEN: ${{ secrets.TOTALCORNER_TOKEN }}
          TOTALCORNER_WEB_COOKIE: ${{ secrets.TOTALCORNER_WEB_COOKIE }}
        run: |
          set -euo pipefail
          for v in PRIVATE_REPO_TOKEN TOTALCORNER_TOKEN; do
            if [ -z "${!v:-}" ]; then
              echo "::error::Missing required secret: $v"
              exit 2
            fi
          done
          if [ -z "${TOTALCORNER_WEB_COOKIE:-}" ]; then
            echo "::warning::No TotalCorner website session is configured; MR1 AI will report source unavailable and send nothing."
          fi

      - name: Checkout private MR1
        uses: actions/checkout@v4
        with:
          repository: ljm198964-alt/mr1-shadow
          ref: master
          fetch-depth: 0
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}

      - name: Checkout shared football registry
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          repository: ljm198964-alt/totalcorner-research-bridge
          ref: master
          path: external/football-display-registry
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          sparse-checkout: |
            data/football_display_names
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Record base
        run: echo "RUNTIME_BASE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Check hosted AI source only (no TG, no Crown API)
        if: github.event_name == 'push'
        env:
          TOTALCORNER_WEB_COOKIE: ${{ secrets.TOTALCORNER_WEB_COOKIE }}
        run: |
          node --input-type=module - <<'JS'
          import {loadAiPages} from './src/ai-picks-page.js';
          const d=await loadAiPages();
          console.log('MR1_AI_SOURCE_DIAGNOSTIC '+JSON.stringify({
            access_status:d.source_access.access_status,
            parsed_ah_picks:d.source_access.parsed_ah_picks,
            parsed_picks:d.source_access.parsed_picks,
            pages:d.source_access.pages.map(p=>({
              access_status:p.access_status,http_status:p.http_status,
              request_authentication:p.request_authentication,parsed_picks:p.parsed_picks
            })),
            telegram_write:false,crown_requests:0
          }));
          JS

      - name: MR1 AI external signal runtime
        if: github.event_name != 'push'
        env:
          TOTALCORNER_TOKEN: ${{ secrets.TOTALCORNER_TOKEN }}
          TOTALCORNER_WEB_COOKIE: ${{ secrets.TOTALCORNER_WEB_COOKIE }}
        run: node src/mr1-ai-runtime.js

      - name: Persist MR1 AI state
        if: always()
        env:
          TOTALCORNER_TOKEN: ${{ secrets.TOTALCORNER_TOKEN }}
          TOTALCORNER_WEB_COOKIE: ${{ secrets.TOTALCORNER_WEB_COOKIE }}
        run: node src/persist-mr1-ai-state.js
