name: M3 TotalCorner Default Odds EV Shadow
on:
  workflow_dispatch:
  schedule:
    - cron: '50 */4 * * *'
permissions:
  contents: read
concurrency:
  group: m3-totalcorner-default-shadow
  cancel-in-progress: false
jobs:
  shadow:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Calculate source-labeled forecast EV
        env:
          TOTALCORNER_TOKEN: ${{ secrets.TOTALCORNER_TOKEN }}
        run: |
          python -m research.m3.totalcorner_shadow_ev --ledger research/m3/results/openfootball/shadow_ledger.jsonl --private-output "$RUNNER_TEMP/m3-totalcorner-default-shadow.jsonl"
          python -m json.tool research/m3/results/openfootball/latest_shadow_run.json > /dev/null
      - name: Preserve independent EV ledger and execution receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m3-totalcorner-default-ev-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/m3-totalcorner-default-shadow.jsonl
          retention-days: 90
          if-no-files-found: warn
