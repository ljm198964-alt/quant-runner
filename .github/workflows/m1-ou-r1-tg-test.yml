name: M1 OU R1 Telegram channel test
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/m1-ou-r1-tg-test.yml'
permissions:
  contents: read
jobs:
  send-test:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Send one Telegram test message
        env:
          BOT_TOKEN: ${{ secrets.M1_TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.M1_TELEGRAM_CHAT_ID }}
        run: |
          python3 - <<'PY'
          import json,os,urllib.parse,urllib.request
          token=os.environ.get("BOT_TOKEN","")
          chat=os.environ.get("CHAT_ID","")
          if not token or not chat:
              raise SystemExit("M1 Telegram secrets missing")
          message="【M1 OU R1】TG 通道测试（非实战单）"
          data=urllib.parse.urlencode({"chat_id":chat,"text":message}).encode()
          request=urllib.request.Request("https://api.telegram.org/bot"+token+"/sendMessage",data=data,method="POST")
          with urllib.request.urlopen(request,timeout=20) as response:
              result=json.load(response)
          if not result.get("ok"):
              raise SystemExit("Telegram did not confirm delivery")
          print("TELEGRAM_TEST_OK message_id="+str(result["result"]["message_id"]))
          PY
