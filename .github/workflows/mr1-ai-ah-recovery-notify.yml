name: MR1 AI AH Recovery Notify

on:
  workflow_dispatch:
    inputs:
      capture_path:
        description: 'Recovered MR1 AI capture path'
        required: true
        type: string

permissions:
  contents: read

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check required secrets
        shell: bash
        env:
          PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
          MR1_TG_BOT_TOKEN: ${{ secrets.MR1_TG_BOT_TOKEN }}
          MR1_TG_CHAT_ID: ${{ secrets.MR1_TG_CHAT_ID }}
        run: |
          set -euo pipefail
          test -n "$PRIVATE_REPO_TOKEN"
          test -n "$MR1_TG_BOT_TOKEN"
          test -n "$MR1_TG_CHAT_ID"
      - name: Checkout private MR1
        uses: actions/checkout@v4
        with:
          repository: ljm198964-alt/mr1-shadow
          ref: master
          fetch-depth: 0
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Deliver recovered eligible AH signals only
        env:
          MR1_TG_BOT_TOKEN: ${{ secrets.MR1_TG_BOT_TOKEN }}
          MR1_TG_CHAT_ID: ${{ secrets.MR1_TG_CHAT_ID }}
          CAPTURE_PATH: ${{ inputs.capture_path }}
        run: node src/mr1-ai-browser-forward-notify.js "$CAPTURE_PATH"
      - name: Persist recovery receipts
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- data/mr1-ai-browser-forward/telegram-notify-status.json data/mr1-v7-ai-picks/telegram-ah-sent.jsonl data/mr1-v7-ai-picks/telegram-outbox 2>/dev/null || true
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Recover MR1 AI AH notifications after reconcile'
          git pull --rebase origin master
          git push origin HEAD:master
