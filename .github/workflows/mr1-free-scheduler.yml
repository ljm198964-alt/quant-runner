name: MR1 Free Scheduler

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/mr1-free-scheduler.yml'

permissions:
  actions: write
  contents: read

concurrency:
  group: mr1-free-scheduler
  cancel-in-progress: false

jobs:
  bounded-backfill-pause:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - run: echo "MR1_SCHEDULER_PAUSED_FOR_BOUNDED_HISTORY_BACKFILL"
