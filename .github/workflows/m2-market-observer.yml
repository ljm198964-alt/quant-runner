name: M2 Market Research Observer

on:
  workflow_dispatch:
  push:
    paths:
      - 'research/m2/**'
      - '.github/workflows/m2-market-observer.yml'
  schedule:
    - cron: '50 4,10,16,22 * * *'

permissions:
  contents: write

concurrency:
  group: m2-market-observer
  cancel-in-progress: false

jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout public M2 observer
        uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: M2 strict time, Crown and encrypted-ledger unit tests
        run: |
          python -m pip install cryptography
          python -m unittest -v research.m2.test_m2_shadow research.m2.test_encrypted_ledger research.m2.test_settle_forward research.m2.test_market_dataset
      - name: Validate existing source access
        shell: bash
        env:
          PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
        run: |
          if [ -z "${PRIVATE_REPO_TOKEN:-}" ]; then
            echo "::error::Existing source checkout token is unavailable"
            exit 2
          fi
      - name: Checkout existing market evidence read-only
        uses: actions/checkout@v4
        with:
          repository: ljm198964-alt/totalcorner-research-bridge
          ref: master
          path: source
          persist-credentials: false
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
      - name: Observe latest complete scan and market residual features
        env:
          SOURCE_PATH: source/results/latest.json
          OUTPUT_PATH: ${{ runner.temp }}/m2-observations.json
        shell: bash
        run: |
          python research/m2/m2_shadow.py --source "$SOURCE_PATH" --output "$OUTPUT_PATH"
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path
          r=json.loads(Path(os.environ["OUTPUT_PATH"]).read_text())
          finished=datetime.fromisoformat(r["source_scan_finished_at"].replace("Z","+00:00"))
          age=(datetime.now(timezone.utc)-finished).total_seconds()/3600
          summary=Path(os.environ["GITHUB_STEP_SUMMARY"])
          with summary.open("a") as f:
              f.write("## M2 read-only forward observation\n\n")
              f.write(f"- Source scan: {r['source_run_id']}\n")
              f.write(f"- Age of source scan: {age:.2f} hours\n")
              f.write(f"- Eligible observations: {r['observation_count']}\n")
              f.write("- Locked orders: 0; Telegram sends: 0\n")
              f.write("- No performance or ROI claim; independent calibration pending.\n")
          if age < -0.1 or age > 6:
              raise SystemExit("Source scan stale: cannot call this a fresh forward observation")
          PY

      - name: Audit independent two-sided Crown samples and strictly verified FT
        shell: bash
        run: |
          python research/m2/market_dataset.py --runs source/results/runs --ledger source/results/m1_formal_ledger.json --out "$RUNNER_TEMP/m2-training-audit.json"
          python - <<'PY'
          import json,os
          from pathlib import Path
          p=Path(os.environ["RUNNER_TEMP"],"m2-training-audit.json")
          audit=json.loads(p.read_text(encoding="utf-8"))
          c=audit["counts"]
          with open(os.environ["GITHUB_STEP_SUMMARY"],"a") as f:
              f.write("\n## M2 independent two-sided Crown data audit\n\n")
              f.write(f"- Verified time-safe samples: {c.get('AUDITED_VERIFIED_SAMPLES',0)}\n")
              f.write(f"- Distinct verified fixtures: {c.get('AUDITED_UNIQUE_MATCHES',0)}\n")
              f.write("- No training metrics claimed until sufficient independent results.\n")
          PY
      # No raw market sample dataset or premium odds uploaded to public artifacts.
      # Protected Crown snapshots stay in runner.temp, never public artifacts.

      - name: Encrypt and persist prospective observations without public plaintext
        shell: bash
        env:
          M2_LEDGER_SECRET: ${{ secrets.PRIVATE_REPO_TOKEN }}
          OUTPUT_PATH: ${{ runner.temp }}/m2-observations.json
        run: |
          set -euo pipefail
          python research/m2/encrypted_ledger.py --observations "$OUTPUT_PATH" --ledger-folder research/m2/encrypted_forward
          python -m research.m2.settle_forward --ledger-folder research/m2/encrypted_forward --verified-formal-ledger source/results/m1_formal_ledger.json
          if [ -n "$(git status --porcelain -- research/m2/encrypted_forward)" ]; then
            git config user.name "quant-runner-m2"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add research/m2/encrypted_forward/
            git commit -m "Record encrypted M2 prospective observations [skip ci]"
            for i in 1 2 3; do
              if git pull --rebase origin main && git push origin HEAD:main; then
                echo "M2_ENCRYPTED_LEDGER_COMMITTED"
                exit 0
              fi
              sleep $((i*4))
            done
            echo "::error::M2 encrypted ledger write failed; do not report durability"
            exit 1
          else
            echo "M2_NO_NEW_ENCRYPTED_BATCH"
          fi
