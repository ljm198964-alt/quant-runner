name: MR1 corrected defense rolling audit once
on:
  push:
    paths:
      - '.github/workflows/mr1-defense-sign-audit-once.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ljm198964-alt/mr1-shadow
          ref: master
          fetch-depth: 1
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build market baseline
        run: node src/build-market-implied-v2.js > /tmp/build-market-implied.log
      - name: Run corrected AH defence-sign rolling evaluation
        run: |
          python3 - <<'PY'
          p='src/residual-model.js'
          s=open(p).read()
          old="attack_defence_goal_difference: stateNumber(state, 'home_attack_rate') - stateNumber(state, 'away_defence_rate') - stateNumber(state, 'away_attack_rate') + stateNumber(state, 'home_defence_rate'),"
          new="attack_defence_goal_difference: stateNumber(state, 'home_attack_rate') + stateNumber(state, 'away_defence_rate') - stateNumber(state, 'away_attack_rate') - stateNumber(state, 'home_defence_rate'),"
          assert old in s
          open(p,'w').write(s.replace(old,new))
          PY
          node src/rolling-evaluation-v2.js > /tmp/corrected.log
      - name: Compare corrected result to committed current report
        run: |
          git show HEAD:data/processed/rolling-evaluation-v2.json > /tmp/current.json
          cp data/processed/rolling-evaluation-v2.json /tmp/corrected.json
          python3 - <<'PY'
          import json
          a=json.load(open('/tmp/current.json'));b=json.load(open('/tmp/corrected.json'))
          def compact(r,m):
              x=r['markets'][m]['complete_t24_state']
              return {
                'n':x['n'],
                'incremental':x['incremental'],
                'score_distribution_incremental':x['score_distribution'].get('incremental_vs_market'),
                'promotion_gate':x['promotion_gate'],
                'folds':[{
                  'train_end':f['train_end'],
                  'incremental':f.get('complete_state_incremental'),
                  'score_incremental':f.get('complete_state_score_distribution_incremental'),
                  'model':f.get('delta_mu_model') if m=='AH' else f.get('delta_tau_model')
                } for f in r['markets'][m]['fold_diagnostics']]
              }
          print('MR1_DEFENSE_SIGN_ROLLING='+json.dumps({
            'AH_current':compact(a,'AH'),'AH_corrected':compact(b,'AH'),
            'OU_current':compact(a,'OU'),'OU_corrected_control':compact(b,'OU'),
            'joint_current':a.get('joint_residual_correction'),
            'joint_corrected':b.get('joint_residual_correction')
          },separators=(',',':')))
          PY
