name: MR1 dynamic history gap backfill once
on:
  push:
    paths:
      - '.github/workflows/mr1-dynamic-history-gap-backfill-once.yml'
permissions:
  contents: read
concurrency:
  group: totalcorner-api-runtime
  cancel-in-progress: false
jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ljm198964-alt/mr1-shadow
          ref: master
          fetch-depth: 0
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Derive missing league IDs from actual prospective failures
        id: plan
        run: |
          python3 - <<'PY'
          import json,glob,os,collections
          def load(p,d=None):
              try:return json.load(open(p))
              except:return d
          history_leagues=set()
          for p in glob.glob('data/raw/league-history*.json'):
              x=load(p,{})
              for bucket in (x.get('leagues') or {}).values():
                  for m in bucket.get('matches') or []:
                      if m.get('l'): history_leagues.add(str(m['l']))
          fixtures=load('data/prospective-market/shadow-v23/fixtures.json',{})
          missing_ids={}
          for p in glob.glob('data/strategy-runs/*/all-markets.json'):
              if 'PROSPECTIVE_' not in p: continue
              for r in load(p,[]):
                  if 'MISSING_REQUIRED_TEAM_FEATURES' not in (r.get('reasons') or []): continue
                  lg=str(r.get('league') or '')
                  if not lg or lg in history_leagues: continue
                  f=fixtures.get(str(r.get('match_id'))) or {}
                  lid=f.get('league_id')
                  if lid is not None and str(lid).strip(): missing_ids[str(lid)]=lg
          ids=','.join(sorted(missing_ids,key=lambda x:int(x) if x.isdigit() else x))
          print(json.dumps({'missing_league_ids':missing_ids,'count':len(missing_ids)},ensure_ascii=False,indent=2))
          with open(os.environ['GITHUB_OUTPUT'],'a') as g:g.write('league_ids='+ids+'\n')
          PY
      - name: Backfill missing league histories
        if: steps.plan.outputs.league_ids != ''
        env:
          TOTALCORNER_TOKEN: ${{ secrets.TOTALCORNER_TOKEN }}
          MR1_LEAGUE_IDS: ${{ steps.plan.outputs.league_ids }}
          MR1_HISTORY_PAGES: '3'
          MR1_RPM: '6'
        run: node src/collect-league-history.js
      - name: Persist history evidence
        if: steps.plan.outputs.league_ids != ''
        run: |
          git config user.name "mr1-history-gap-backfill"
          git config user.email "actions@users.noreply.github.com"
          git add data/raw/league-history-batch-*.json
          if git diff --cached --quiet; then echo NO_NEW_HISTORY; exit 0; fi
          git commit -m "Backfill MR1 dynamically discovered history gaps"
          git pull --rebase origin master
          git push origin HEAD:master
