name: MR1 AI Browser Settlement

on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'
  push:
    paths:
      - 'trigger/mr1_ai_browser_settlement.json'
      - '.github/workflows/mr1-ai-browser-settlement.yml'

permissions:
  contents: read

concurrency:
  # Isolate settlement from the five-minute collector queue; retain serial settlement writes.
  group: mr1-ai-browser-settlement
  cancel-in-progress: false

jobs:
  settle:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check required secrets
        shell: bash
        env:
          PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
          TOTALCORNER_TOKEN: ${{ secrets.TOTALCORNER_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$PRIVATE_REPO_TOKEN"
          test -n "$TOTALCORNER_TOKEN"

      - name: Checkout private MR1
        uses: actions/checkout@v4
        with:
          repository: ljm198964-alt/mr1-shadow
          ref: master
          fetch-depth: 0
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Follow first-tier forward OU market
        if: always()
        continue-on-error: true
        env:
          TOTALCORNER_TOKEN: ${{ secrets.TOTALCORNER_TOKEN }}
        run: node src/mr1-ai-ou-market-follow-v12.js

      - name: Settle research-only OU V12 contracts
        if: always()
        continue-on-error: true
        run: node src/mr1-ai-ou-settlement-v12.js

      - name: V13.2 research chronology regression
        if: always()
        continue-on-error: true
        run: node --test test-mr1-ai-v13-2.js

      - name: V13.2 descriptive quote and settlement analysis
        if: always()
        continue-on-error: true
        run: node src/mr1-ai-v13-2-price-validation.js

      - name: V13.4 paired-source freshness regression
        if: always()
        continue-on-error: true
        run: node --test test-mr1-ai-v13-4.js

      - name: V13.4 source-specific quote freshness analysis
        if: always()
        continue-on-error: true
        run: node src/mr1-ai-v13-4-source-freshness.js

      - name: V13.5 other-bookmaker quote test
        if: always()
        continue-on-error: true
        run: node --test test-mr1-ai-v13-5.js

      - name: V13.5 read-only other-bookmaker OU crosscheck
        if: always()
        continue-on-error: true
        env:
          TOTALCORNER_TOKEN: ${{ secrets.TOTALCORNER_TOKEN }}
        run: node src/mr1-ai-v13-5-bookmaker-crosscheck.js

      - name: V13.6 quote-comparison regression
        if: always()
        continue-on-error: true
        run: node --test test-mr1-ai-v13-6.js

      - name: V13.6 compare recorded bookmaker quotes
        if: always()
        continue-on-error: true
        run: node src/mr1-ai-v13-6-bookmaker-comparison.js

      - name: Settle finished browser-forward AH contracts
        env:
          TOTALCORNER_TOKEN: ${{ secrets.TOTALCORNER_TOKEN }}
        run: node src/mr1-ai-browser-settlement.js

      - name: Update clean MR1 AI live performance
        if: always()
        continue-on-error: true
        run: node src/mr1-ai-formal-performance.js

      - name: Verify MR1 AI Crown provenance audit
        if: always()
        continue-on-error: true
        run: node --test test-mr1-ai-formal-crown-audit.js

      - name: Audit MR1 AI historical and Crown formal sources
        if: always()
        continue-on-error: true
        run: node src/mr1-ai-formal-crown-audit.js

      - name: Read M1 TG records for V24 Crown-only forward research
        if: always()
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          repository: ljm198964-alt/totalcorner-research-bridge
          ref: master
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: external/m1-study
          persist-credentials: false
          sparse-checkout: |
            results/m1_formal_ledger.json
            results/m1_crown_formal_report.json
          sparse-checkout-cone-mode: false

      - name: Verify V24 chronological M1-prior research
        if: always()
        continue-on-error: true
        run: node --test test-mr1-ai-m1-prior-v24.js

      - name: Update V24 frozen historical and Crown AI-forward comparison
        if: always()
        continue-on-error: true
        run: node src/mr1-ai-m1-prior-v24.js update external/m1-study/results/m1_formal_ledger.json external/m1-study/results/m1_crown_formal_report.json

      - name: Verify V25 date-stratified confounding research
        if: always()
        continue-on-error: true
        run: node --test test-mr1-ai-m1-prior-v25.js

      - name: Update V25 M1 prior selection-bias diagnostic
        if: always()
        continue-on-error: true
        run: node src/mr1-ai-m1-prior-v25.js

      - name: Update MR1 AI optimization research
        if: always()
        continue-on-error: true
        run: node src/mr1-ai-optimization-research.js

      - name: Check MR1 AI local collector freshness
        if: always()
        continue-on-error: true
        run: node src/mr1-ai-collector-watch.js

      - name: Persist settlement and research
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- data/mr1-ai-browser-forward/settlement data/mr1-ai-browser-forward/settlement-resolution data/mr1-ai-browser-forward/formal-performance data/mr1-ai-browser-forward/optimization-research data/mr1-ai-browser-forward/m1-prior-v24 data/mr1-ai-browser-forward/m1-prior-v25 data/mr1-ai-browser-forward/collector-watch-status.json
          if [ -d data/mr1-ai-ou-forward-v12 ]; then git add -- data/mr1-ai-ou-forward-v12; fi
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Settle MR1 AI browser-forward contracts'
          # The TotalCorner transport updates local rate-limit/checkpoint files outside
          # the isolated settlement paths. Discard those runtime-only changes before rebase.
          git reset --hard HEAD
          git pull --rebase origin master
          # A concurrent collector may advance master between pull and push.
          # Retry the same commit against the new head without dropping research output.
          until git push origin HEAD:master; do
            git pull --rebase origin master
          done
