name: MR1 AI Browser Settlement

on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'
  push:
    paths:
      - 'trigger/mr1_ai_browser_settlement.json'
      - '.github/workflows/mr1-ai-browser-settlement.yml'

permissions:
  contents: read

concurrency:
  group: totalcorner-api-runtime
  cancel-in-progress: false

jobs:
  settle:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check required secrets
        shell: bash
        env:
          PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
          TOTALCORNER_TOKEN: ${{ secrets.TOTALCORNER_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$PRIVATE_REPO_TOKEN"
          test -n "$TOTALCORNER_TOKEN"

      - name: Checkout private MR1
        uses: actions/checkout@v4
        with:
          repository: ljm198964-alt/mr1-shadow
          ref: master
          fetch-depth: 0
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Settle finished browser-forward AH contracts
        env:
          TOTALCORNER_TOKEN: ${{ secrets.TOTALCORNER_TOKEN }}
        run: node src/mr1-ai-browser-settlement.js

      - name: Settle research-only OU V12 contracts
        if: always()
        continue-on-error: true
        run: node src/mr1-ai-ou-settlement-v12.js

      - name: Update clean MR1 AI live performance
        if: always()
        continue-on-error: true
        run: node src/mr1-ai-formal-performance.js

      - name: Update MR1 AI optimization research
        if: always()
        continue-on-error: true
        run: node src/mr1-ai-optimization-research.js

      - name: Check MR1 AI local collector freshness
        if: always()
        continue-on-error: true
        run: node src/mr1-ai-collector-watch.js

      - name: Persist settlement and research
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- data/mr1-ai-browser-forward/settlement data/mr1-ai-browser-forward/settlement-resolution data/mr1-ai-browser-forward/formal-performance data/mr1-ai-browser-forward/optimization-research data/mr1-ai-browser-forward/collector-watch-status.json\n          if [ -d data/mr1-ai-ou-forward-v12 ]; then git add -- data/mr1-ai-ou-forward-v12; fi
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Settle MR1 AI browser-forward contracts'
          # The TotalCorner transport updates local rate-limit/checkpoint files outside
          # the isolated settlement paths. Discard those runtime-only changes before rebase.
          git reset --hard HEAD
          git pull --rebase origin master
          git push origin HEAD:master
