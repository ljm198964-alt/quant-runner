name: MR1 V6 AH regression diagnostic

on:
  push:
    paths:
      - '.github/workflows/mr1-v6-ah-regression-diagnostic.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ljm198964-alt/mr1-shadow
          ref: master
          fetch-depth: 0
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run diagnostic
        shell: bash
        run: |
          set +e
          npm run check > /tmp/check.log 2>&1
          rc1=$?
          node --test test-v6-ah-formal.js > /tmp/test.log 2>&1
          rc2=$?
          set -e
          mkdir -p data/mr1-v6-cross-market/formal
          python - <<'PY'
          import json, pathlib, os
          p=pathlib.Path('/tmp')
          out={
            "syntax_rc": int(os.environ.get("RC1","0")),
            "test_rc": int(os.environ.get("RC2","0")),
          }
          PY
          {
            echo '{'
            echo '  "syntax_rc": '"$rc1"','
            echo '  "test_rc": '"$rc2"','
            echo '  "syntax_log": '"$(python - <<'PY'
          import json
          print(json.dumps(open('/tmp/check.log').read()[-4000:]))
          PY
          )"','
            echo '  "test_log": '"$(python - <<'PY'
          import json
          print(json.dumps(open('/tmp/test.log').read()[-8000:]))
          PY
          )"
            echo '}'
          } > data/mr1-v6-cross-market/formal/regression-diagnostic.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/mr1-v6-cross-market/formal/regression-diagnostic.json
          git commit -m 'Record MR1 V6 AH regression diagnostic'
          git pull --rebase origin master
          git push origin HEAD:master
          test "$rc1" -eq 0
          test "$rc2" -eq 0
