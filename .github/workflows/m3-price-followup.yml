name: M3 TotalCorner Price Followup
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/m3-price-followup.yml'
  schedule:
    - cron: '*/15 * * * *'
permissions:
  contents: write
concurrency:
  group: m3-forward-ev-shadow
  cancel-in-progress: false
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Capture actual follow-up quotes for pending M3 fixtures
        env:
          TOTALCORNER_TOKEN: ${{ secrets.TOTALCORNER_TOKEN }}
        run: |
          python -m research.m3.totalcorner_price_followup \
            --ledger research/m3/results/totalcorner/forward_ev_ledger.jsonl \
            --max-matches 25
      - name: Persist append-only M3 price observations
        run: |
          python -m research.m3.persist_append_ledger \
            --candidate research/m3/results/totalcorner/forward_ev_ledger.jsonl
