name: MR1 browser quote read only
on:
  push:
    paths:
      - '.github/workflows/mr1-browser-quote-check-once.yml'
permissions:
  contents: read
jobs:
  read:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Query documented existing match endpoints without importing production
        env:
          TOTALCORNER_TOKEN: ${{ secrets.TOTALCORNER_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p sealed
          cat > recipient.pem <<'CERT'
