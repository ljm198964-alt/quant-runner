name: MR1 browser quote read only
on:
  push:
    paths:
      - '.github/workflows/mr1-browser-quote-check-once.yml'
permissions:
  contents: read
jobs:
  read:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Query existing match endpoints without importing production
        env:
          TOTALCORNER_TOKEN: ${{ secrets.TOTALCORNER_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p sealed
          python3 - <<'PY'
          import os,json,time,gzip,re,hashlib,ssl
          from pathlib import Path
          from datetime import datetime,timezone
          from urllib.request import Request,build_opener,HTTPRedirectHandler,urlopen
          from urllib.parse import urlencode
          from urllib.error import HTTPError
          # Public encryption certificate only; the private key never leaves the audit environment.
          known='https://raw.githubusercontent.com/ljm198964-alt/quant-runner/4b141a877b607402c171cd61cf177b4a67184818/.github/workflows/mr1-browser-evidence-read-once.yml'
          with urlopen(known,timeout=20) as response: public_source=response.read().decode()
          found=re.search(r'-----BEGIN CERTIFICATE-----[\s\S]*?-----END CERTIFICATE-----',public_source)
          if found is None:raise RuntimeError('Missing pinned public recipient certificate')
          pem='\n'.join(x.strip() for x in found[0].splitlines())+'\n'
          if hashlib.sha256(ssl.PEM_cert_to_DER_cert(pem)).hexdigest()!='ffba93dfc0ec7acb4ca48d1b46d57d9628c2c98052ca4d9e1685c23fa05fc665':raise RuntimeError('Recipient certificate digest mismatch')
          Path('recipient.pem').write_text(pem)
          class NoRedirect(HTTPRedirectHandler):
              def redirect_request(self,req,fp,code,msg,headers,newurl):return None
          token=os.environ.get('TOTALCORNER_TOKEN','').strip()
          out={'mode':'READ_ONLY_FOUR_CASE_DIAGNOSTIC','messages_sent':0,'production_state_written':False,'secret_present':bool(token),'started_at':datetime.now(timezone.utc).isoformat(),'responses':[],'case_note':'One ID absent from both saved views, one present only in M1, one changed AH line, and one old kickoff-version quote. These are diagnostic examples, not a production limit or selection rule.'}
          if token:
              for mid in ['202150359','201150828','201658719','201317134']:
                  for endpoint,columns in [('view','asian,goalLine'),('odds','asianList,goalList,oddsList')]:
                      time.sleep(2.6)
                      url='https://api.totalcorner.com/v1/match/'+endpoint+'/'+mid+'?'+urlencode({'token':token,'columns':columns})
                      record={'requested_match_id':mid,'endpoint':endpoint,'requested_at':datetime.now(timezone.utc).isoformat()}
                      try:
                          try:response=build_opener(NoRedirect()).open(Request(url,headers={'Accept':'application/json','User-Agent':'MR1-read-only/0.1'}),timeout=30)
                          except HTTPError as exc:response=exc
                          with response:
                              record['http_status']=response.code
                              raw=response.read().decode('utf-8',errors='replace')
                          try:record['body']=json.loads(raw)
                          except ValueError:record['error_type']='NON_JSON_RESPONSE'
                      except Exception as exc:record['error_type']=type(exc).__name__
                      record['received_at']=datetime.now(timezone.utc).isoformat();out['responses'].append(record)
          out['finished_at']=datetime.now(timezone.utc).isoformat()
          payload=json.dumps(out,ensure_ascii=False)
          if token:payload=payload.replace(token,'[REDACTED]')
          Path('payload.json.gz').write_bytes(gzip.compress(payload.encode()))
          print(json.dumps({'read_only':True,'requests':len(out['responses']),'responses_200':sum(x.get('http_status')==200 for x in out['responses']),'messages_sent':0}))
          PY
          openssl cms -encrypt -binary -aes-256-cbc -in payload.json.gz -out sealed/quotes.cms -outform DER recipient.pem
          rm -f payload.json.gz recipient.pem
      - uses: actions/upload-artifact@v4
        with:
          name: mr1-browser-quote-check-sealed
          path: sealed/quotes.cms
