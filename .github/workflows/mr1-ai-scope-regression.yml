name: MR1 AI scope regression
on:
  push:
    paths:
      - '.github/workflows/mr1-ai-scope-regression.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ljm198964-alt/mr1-shadow
          ref: master
          fetch-depth: 0
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check src/mr1-ai-formal-scope.js
      - run: node --check src/mr1-ai-browser-forward-notify.js
      - run: node --test test-mr1-ai-formal-scope.js
      - name: Persist
        run: |
          set -euo pipefail
          printf '{\n  "status": "PASS",\n  "scope": "M1_USER_SCOPE_20261003_TOP_TIER_V2_MIRROR",\n  "telegram_real_send": false\n}\n' > data/mr1-ai-browser-forward/scope-regression.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/mr1-ai-browser-forward/scope-regression.json
          git commit -m 'Verify MR1 AI formal competition scope'
          git pull --rebase origin master
          git push origin HEAD:master
