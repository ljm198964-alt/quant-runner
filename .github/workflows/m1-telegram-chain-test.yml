name: M1 Telegram Chain Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  send-once:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Send the one authorized M1 test message
        env:
          M1_TELEGRAM_BOT_TOKEN: ${{ secrets.M1_TELEGRAM_BOT_TOKEN }}
          M1_TELEGRAM_CHAT_ID: ${{ secrets.M1_TELEGRAM_CHAT_ID }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys
          import urllib.error
          import urllib.parse
          import urllib.request

          token = os.environ.get("M1_TELEGRAM_BOT_TOKEN")
          chat_id = os.environ.get("M1_TELEGRAM_CHAT_ID")
          if not token or not chat_id:
              print("M1_TEST_MESSAGE_FAILED: missing M1 Telegram secret")
              sys.exit(2)
          message = "【M1】TG发送链测试"
          payload = urllib.parse.urlencode({"chat_id": chat_id, "text": message}).encode()
          request = urllib.request.Request(
              "https://api.telegram.org/bot" + token + "/sendMessage",
              data=payload,
              method="POST",
          )
          try:
              with urllib.request.urlopen(request, timeout=20) as response:
                  data = json.load(response)
          except urllib.error.HTTPError as exc:
              print(f"M1_TEST_MESSAGE_FAILED: HTTP {exc.code}")
              sys.exit(1)
          except Exception:
              print("M1_TEST_MESSAGE_FAILED: transport error")
              sys.exit(1)
          result = data.get("result") or {}
          if not data.get("ok") or result.get("text") != message or str(result.get("chat", {}).get("id")) != chat_id:
              print("M1_TEST_MESSAGE_FAILED: provider receipt mismatch")
              sys.exit(1)
          print("M1_TEST_MESSAGE_SENT: provider receipt verified")
          print("M1_FREE_RUNTIME_TELEGRAM_READY: both M1 secrets readable")
          PY
