name: M3 Price Dislocation Dataset
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/m3-price-dislocation.yml'
      - 'research/m3/price_dislocation_prediction.py'
      - 'research/m3/price_dislocation_answers.py'
      - 'research/m3/price_movement_fit.py'
      - 'research/m3/price_data_diagnostics.py'
permissions:
  contents: read
jobs:
  build-dataset:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Diagnose quote and forecast pairing from full production ledger
        run: |
          python -m research.m3.price_data_diagnostics \
            --ledger research/m3/results/totalcorner/forward_ev_ledger.jsonl \
            --output research/m3/results/totalcorner/price_data_diagnostics.json
      - name: Generate timestamp-safe M3 market dislocation features and labels
        run: |
          python -m research.m3.price_dislocation_prediction \
            --ledger research/m3/results/totalcorner/forward_ev_ledger.jsonl \
            --output research/m3/results/totalcorner/price_dislocation_dataset.json
      - name: Produce M3 candidate answers from actual quotes
        run: |
          python -m research.m3.price_dislocation_answers \
            --dataset research/m3/results/totalcorner/price_dislocation_dataset.json \
            --output research/m3/results/totalcorner/price_dislocation_answers.json
      - name: Walk-forward train and evaluate observed price movements
        run: |
          python -m research.m3.price_movement_fit \
            --dataset research/m3/results/totalcorner/price_dislocation_dataset.json \
            --output research/m3/results/totalcorner/price_movement_walk_forward.json
      - name: Archive research dataset
        uses: actions/upload-artifact@v4
        with:
          name: m3-price-dislocation-dataset
          path: |
            research/m3/results/totalcorner/price_dislocation_dataset.json
            research/m3/results/totalcorner/price_dislocation_answers.json
            research/m3/results/totalcorner/price_movement_walk_forward.json
            research/m3/results/totalcorner/price_data_diagnostics.json
          if-no-files-found: error
