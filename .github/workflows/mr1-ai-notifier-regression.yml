name: MR1 AI notifier regression

on:
  push:
    paths:
      - '.github/workflows/mr1-ai-notifier-regression.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout private MR1
        uses: actions/checkout@v4
        with:
          repository: ljm198964-alt/mr1-shadow
          ref: master
          fetch-depth: 0
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Syntax check
        run: npm run check
      - name: Fresh-only notifier test
        run: node --test test-mr1-ai-browser-forward-notify.js
      - name: Persist test result
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data/mr1-ai-browser-forward
          printf '{\n  "status": "PASS",\n  "test": "test-mr1-ai-browser-forward-notify.js",\n  "telegram_real_send": false\n}\n' > data/mr1-ai-browser-forward/notifier-test.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/mr1-ai-browser-forward/notifier-test.json
          git commit -m 'Verify MR1 AI fresh-only Telegram notifier'
          git pull --rebase origin master
          git push origin HEAD:master
