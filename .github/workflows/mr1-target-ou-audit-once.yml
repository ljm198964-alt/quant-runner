name: MR1 target universe OU audit once
on:
  push:
    paths:
      - '.github/workflows/mr1-target-ou-audit-once.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ljm198964-alt/mr1-shadow
          ref: master
          fetch-depth: 1
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
      - name: Summarize target-universe OU competition evidence
        run: |
          python3 - <<'PY'
          import json
          u=json.load(open('config/mr1-research-universe-v1.json'))
          second=set(u['second_tier_totalcorner_exact'])
          opponent=set(u['confirmed_existing_dataset_aliases'].values())
          target=second|opponent
          r=json.load(open('data/processed/rolling-evaluation-v2.json'))
          cs=r['markets']['OU']['complete_t24_state']
          stab=cs.get('competition_stability') or {}
          groups=stab.get('groups') or []
          if isinstance(groups,dict):
              groups=[dict(v,competition=k) if isinstance(v,dict) else {'competition':k,'value':v} for k,v in groups.items()]
          print('GROUP_EXAMPLE='+json.dumps(groups[:3],separators=(',',':')))
          selected=[]
          for g in groups:
              name=g.get('competition') or g.get('league') or g.get('name')
              if name in target:
                  selected.append(g)
          def metric(g,*keys):
              for k in keys:
                  v=g.get(k)
                  if isinstance(v,(int,float)):return v
              return None
          ranked=sorted(selected,key=lambda g:(metric(g,'incremental_log_loss','log_loss_increment','log_loss_gain') if metric(g,'incremental_log_loss','log_loss_increment','log_loss_gain') is not None else -999),reverse=True)
          def agg(names):
              xs=[g for g in groups if (g.get('competition') or g.get('league') or g.get('name')) in names and isinstance(g.get('n'),(int,float)) and g.get('n')>0]
              n=sum(g['n'] for g in xs)
              def w(k): return sum(g['n']*g[k] for g in xs if isinstance(g.get(k),(int,float)))/sum(g['n'] for g in xs if isinstance(g.get(k),(int,float))) if any(isinstance(g.get(k),(int,float)) for g in xs) else None
              return {'groups':len(xs),'n':n,'weighted_log_loss_increment':w('incremental_log_loss'),'weighted_brier_increment':w('incremental_brier'),'positive_log_loss_group_rate':sum(g.get('incremental_log_loss',0)>0 for g in xs)/len(xs) if xs else None,'positive_brier_group_rate':sum(g.get('incremental_brier',0)>0 for g in xs)/len(xs) if xs else None}
          print('TARGET_OU_AGG='+json.dumps({'second_tier':agg(second),'opponent_mapped':agg(opponent),'union':agg(target)},separators=(',',':')))
          print('TARGET_OU_GROUPS='+json.dumps({
            'n':len(selected),
            'second_tier_count':sum((g.get('competition') or g.get('league') or g.get('name')) in second for g in selected),
            'opponent_mapped_count':sum((g.get('competition') or g.get('league') or g.get('name')) in opponent for g in selected),
            'groups':ranked
          },separators=(',',':')))
          PY
