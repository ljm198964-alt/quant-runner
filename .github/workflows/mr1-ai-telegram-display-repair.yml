name: MR1 AI Telegram Display Repair

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout MR1
        uses: actions/checkout@v4
        with:
          repository: ljm198964-alt/mr1-shadow
          ref: master
          fetch-depth: 0
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}

      - name: Checkout shared Chinese registry
        uses: actions/checkout@v4
        with:
          repository: ljm198964-alt/totalcorner-research-bridge
          ref: master
          path: external/football-display-registry
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          sparse-checkout: |
            data/football_display_names
          sparse-checkout-cone-mode: true
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Edit existing MR1 AI messages in place
        env:
          MR1_TG_BOT_TOKEN: ${{ secrets.MR1_TG_BOT_TOKEN }}
          MR1_TG_CHAT_ID: ${{ secrets.MR1_TG_CHAT_ID }}
        shell: bash
        run: |
          cat > mr1-ai-display-repair.mjs <<'JS'
          import fs from 'node:fs/promises';
          import path from 'node:path';
          import {loadFootballDisplayRegistry,displayFootballFixture} from './src/football-display-names.js';
          import {formatAiAhTelegram} from './src/v7-ai-picks-telegram.js';

          const SENT='data/mr1-v7-ai-picks/telegram-ah-sent.jsonl';
          const LEDGER='data/mr1-ai-browser-forward/prospective-ledger.json';
          const CACHE='data/mr1-ai-browser-forward/display-repair-cache.json';
          const REPORT='data/mr1-ai-browser-forward/telegram-edit-repair.json';

          const hasHan=v=>/[\\u3400-\\u9fff]/u.test(String(v??''));
          const hasLatin=v=>/[A-Za-z]{2,}/u.test(String(v??'').replace(/MR1 AI| vs /gu,''));
          const bad=v=>String(v??'').includes('未知')||hasLatin(v);
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          const readJson=async(p,f)=>JSON.parse(await fs.readFile(p,'utf8').catch(e=>e.code==='ENOENT'?JSON.stringify(f):Promise.reject(e)));
          const saveJson=async(p,v)=>{await fs.mkdir(path.dirname(p),{recursive:true});await fs.writeFile(p,JSON.stringify(v,null,2)+'\\n');};

          const letterZh={A:'诶',B:'比',C:'西',D:'迪',E:'伊',F:'艾弗',G:'吉',H:'艾尺',I:'艾',J:'杰',K:'开',L:'艾勒',M:'艾姆',N:'艾恩',O:'欧',P:'皮',Q:'丘',R:'阿尔',S:'艾丝',T:'提',U:'优',V:'维',W:'达布柳',X:'艾克斯',Y:'歪',Z:'贼德'};
          const acronymZh=t=>String(t).toUpperCase().split('').map(x=>letterZh[x]||'').join('');
          const cleanup=value=>String(value??'')
            .replace(/\\bAFC\\b/giu,'足球俱乐部').replace(/\\bFC\\b/giu,'足球俱乐部')
            .replace(/\\bOFK\\b/giu,'足球俱乐部').replace(/\\bFK\\b/giu,'足球俱乐部')
            .replace(/\\bFBC\\b/giu,'足球俱乐部').replace(/\\bCD\\b/giu,'体育俱乐部')
            .replace(/\\bU(\\d{2})\\b/giu,'$1岁以下').replace(/\\(W\\)/giu,'女足')
            .replace(/\\bWomen\\b/giu,'女足').replace(/[A-Za-z]{2,}/gu,m=>acronymZh(m))
            .replace(/\\s+/gu,' ').trim();

          async function translateZh(value,cache){
            const raw=String(value??'').trim();
            if(!raw)return null;
            if(hasHan(raw)&&!hasLatin(raw))return raw;
            const key=raw.toLowerCase();
            if(cache[key])return cache[key];
            const url='https://translate.googleapis.com/translate_a/single?client=gtx&sl=auto&tl=zh-CN&dt=t&q='+encodeURIComponent(raw);
            const res=await fetch(url,{signal:AbortSignal.timeout(12000)});
            if(!res.ok)throw new Error('TRANSLATE_HTTP_'+res.status);
            const body=await res.json();
            const out=cleanup((body?.[0]||[]).map(x=>x?.[0]||'').join(''));
            if(!hasHan(out))throw new Error('TRANSLATE_NO_HAN:'+raw);
            cache[key]=out;
            await sleep(100);
            return out;
          }

          async function edit(messageId,text){
            const res=await fetch('https://api.telegram.org/bot'+process.env.MR1_TG_BOT_TOKEN+'/editMessageText',{
              method:'POST',
              headers:{'content-type':'application/json'},
              body:JSON.stringify({chat_id:process.env.MR1_TG_CHAT_ID,message_id:Number(messageId),text,parse_mode:'HTML',disable_web_page_preview:true}),
              signal:AbortSignal.timeout(15000)
            });
            const body=await res.json().catch(()=>null);
            if(res.ok&&body?.ok)return;
            if(String(body?.description||'').includes('message is not modified'))return;
            throw new Error('EDIT_FAILED:'+res.status+':'+String(body?.description||'').slice(0,160));
          }

          const [sentText,ledger,registry,cache]=await Promise.all([
            fs.readFile(SENT,'utf8'),
            readJson(LEDGER,{entries:{}}),
            loadFootballDisplayRegistry(),
            Promise.resolve({})
          ]);
          const rows=sentText.split(String.fromCharCode(10)).filter(Boolean).map(JSON.parse);
          const fixtureByMatch=new Map();
          for(const e of Object.values(ledger.entries||{}))if(e?.fixture?.match_id)fixtureByMatch.set(String(e.fixture.match_id),e.fixture);

          const report={generated_at:new Date().toISOString(),total:rows.length,candidates:0,edited:0,failed:0,no_fixture:0,no_message_id:0,failures:[]};
          for(const row of rows){
            if(Number(row.telegram_message_id)<428)continue;
            if(!bad(row.text))continue;
            report.candidates++;
            if(!row.telegram_message_id){report.no_message_id++;continue;}
            const fixture=fixtureByMatch.get(String(row.match_id));
            if(!fixture){report.no_fixture++;continue;}
            try{
              const d=displayFootballFixture(fixture,registry,{league:fixture.league,match:fixture.home+' vs '+fixture.away});
              let [home,away]=String(d.match||'').split(' vs ');
              let league=d.league||fixture.league;
              if(!hasHan(league)||hasLatin(league))league=await translateZh(league,cache);
              if(!hasHan(home)||hasLatin(home))home=await translateZh(home||fixture.home,cache);
              if(!hasHan(away)||hasLatin(away))away=await translateZh(away||fixture.away,cache);
              const display={league:cleanup(league),home:cleanup(home),away:cleanup(away)};
              if(![display.league,display.home,display.away].every(x=>hasHan(x)&&!hasLatin(x)))throw new Error('DISPLAY_UNRESOLVED');
              const pick={match_id:String(row.match_id),AH:{side:row.ai_side,line:Number(row.ai_line),confidence:row.ai_confidence}};
              const quote={line:Number(row.actual_contract_line),price:Number(row.price)};
              const text=formatAiAhTelegram({fixture,pick,quote,display});
              await edit(row.telegram_message_id,text);
              row.text=text;
              row.telegram_edited_at=new Date().toISOString();
              row.telegram_edit_reason='CHINESE_DISPLAY_REPAIR';
              report.edited++;
              await sleep(80);
            }catch(e){
              report.failed++;
              report.failures.push({match_id:String(row.match_id),message_id:row.telegram_message_id,error:String(e?.message||e)});
            }
          }

          await fs.writeFile(SENT,rows.map(x=>JSON.stringify(x)).join(String.fromCharCode(10))+String.fromCharCode(10));
          await saveJson(CACHE,cache);
          await saveJson(REPORT,report);
          console.log(JSON.stringify(report));
          JS
          node mr1-ai-display-repair.mjs

      - name: Persist repaired receipts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/mr1-v7-ai-picks/telegram-ah-sent.jsonl data/mr1-ai-browser-forward/display-repair-cache.json data/mr1-ai-browser-forward/telegram-edit-repair.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Persist MR1 AI display repair receipts'
          git pull --rebase origin master
          git push origin HEAD:master
