name: MR1 AI Telegram Display Repair
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout MR1
        uses: actions/checkout@v4
        with:
          repository: ljm198964-alt/mr1-shadow
          ref: master
          fetch-depth: 0
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
      - name: Checkout shared Chinese registry
        uses: actions/checkout@v4
        with:
          repository: ljm198964-alt/totalcorner-research-bridge
          ref: master
          path: external/football-display-registry
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          sparse-checkout: |
            data/football_display_names
          sparse-checkout-cone-mode: true
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Update existing MR1 AI messages using curated names only
        env:
          MR1_TG_BOT_TOKEN: ${{ secrets.MR1_TG_BOT_TOKEN }}
          MR1_TG_CHAT_ID: ${{ secrets.MR1_TG_CHAT_ID }}
        run: node src/v7-ai-historical-display-repair.js
      - name: Persist actual edit receipts
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/mr1-v7-ai-picks/telegram-ah-sent.jsonl data/mr1-ai-browser-forward/telegram-edit-repair.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Persist curated MR1 AI Telegram name-only edit receipts'
          git pull --rebase origin master
          git push origin HEAD:master
