name: MR1 prospective counterfactual settlement once
on:
  push:
    paths:
      - '.github/workflows/mr1-prospective-settlement-once.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ljm198964-alt/mr1-shadow
          ref: master
          fetch-depth: 1
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Strict prospective counterfactual settlement
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          import {settleCandidate} from './src/strategy-shadow-core.js';

          const now=Date.now(), cutoff=now-7*86400000;
          const dirs=fs.readdirSync('data/strategy-runs').filter(x=>x.startsWith('MR1_STRATEGY_SHADOW_V1_PROSPECTIVE_'));
          const obs=[];
          for(const d of dirs){
            const base=path.join('data/strategy-runs',d);
            let run; try{run=JSON.parse(fs.readFileSync(path.join(base,'run.json')))}catch{continue}
            if(Date.parse(run.started_at)<cutoff)continue;
            let rows; try{rows=JSON.parse(fs.readFileSync(path.join(base,'all-markets.json')))}catch{continue}
            for(const x of rows){
              if(!Number.isFinite(x.EV)||!Number.isFinite(x.residual)||!Number.isFinite(Date.parse(x.quote_received_at)))continue;
              if(Date.parse(x.quote_received_at)>=Date.parse(x.kickoff))continue;
              obs.push(x);
            }
          }
          obs.sort((a,b)=>Date.parse(a.quote_received_at)-Date.parse(b.quote_received_at));
          const quality=x=>['HIGH','MEDIUM'].includes(x.data_quality?.team_state);
          const residual=x=>Math.abs(x.residual)>=(x.market==='AH'?.10:.15);
          const defs={
            positive_ev:x=>quality(x)&&x.EV>0,
            ev3:x=>quality(x)&&x.EV>=.03,
            ev3_residual:x=>quality(x)&&x.EV>=.03&&residual(x),
            ev3_residual_stress:x=>quality(x)&&x.EV>=.03&&residual(x)&&x.uncertainty?.passed===true
          };
          const results=new Map();
          for(const f of fs.readdirSync('data/strategy-shadow-ledger/results').filter(x=>x.endsWith('.json'))){
            try{const r=JSON.parse(fs.readFileSync(path.join('data/strategy-shadow-ledger/results',f)));if(r.status==='FT')results.set(String(r.match_id),r)}catch{}
          }
          const out={};
          for(const [name,pred] of Object.entries(defs)){
            const first=new Map();
            for(const x of obs){
              if(!pred(x))continue;
              const key=`${x.match_id}|${x.market}`;
              if(!first.has(key))first.set(key,x);
            }
            let settled=0,pnl=0; const states={}; const entries=[];
            for(const x of first.values()){
              const r=results.get(String(x.match_id));
              if(!r)continue;
              const s=settleCandidate({market:x.market,direction:x.direction,line:Number(x.line),price:Number(x.price)},Number(r.home_goals),Number(r.away_goals));
              settled++; pnl+=s.realized_pnl; states[s.settlement]=(states[s.settlement]||0)+1;
              entries.push({match_id:x.match_id,league:x.league,match:x.match,market:x.market,direction:x.direction,line:x.line,price:x.price,EV:x.EV,residual:x.residual,quality:x.data_quality?.team_state,quote_received_at:x.quote_received_at,kickoff:x.kickoff,score:`${r.home_goals}-${r.away_goals}`,settlement:s.settlement,pnl:s.realized_pnl});
            }
            out[name]={selected:first.size,settled,pending:first.size-settled,pnl_units:pnl,roi:settled?pnl/settled:null,states,entries};
          }
          console.log('MR1_PROSPECTIVE_CF='+JSON.stringify(out));
          NODE
