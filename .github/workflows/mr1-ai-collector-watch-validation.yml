name: MR1 AI collector watch validation
on:
  push:
    paths:
      - '.github/workflows/mr1-ai-collector-watch-validation.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ljm198964-alt/mr1-shadow
          ref: master
          fetch-depth: 0
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check
        run: |
          node --check src/mr1-ai-local-browser.js
          node --check src/mr1-ai-local-launchd.js
          node --check src/mr1-ai-one-click.js
          node --check src/mr1-ai-collector-watch.js
      - name: Run collector watch
        run: node src/mr1-ai-collector-watch.js
      - name: Persist validation status
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- data/mr1-ai-browser-forward/collector-watch-status.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Validate MR1 AI collector freshness status'
          git pull --rebase origin master
          git push origin HEAD:master
