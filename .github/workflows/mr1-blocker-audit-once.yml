name: MR1 blocker audit once
on:
  push:
    paths:
      - '.github/workflows/mr1-blocker-audit-once.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ljm198964-alt/mr1-shadow
          ref: master
          fetch-depth: 1
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
      - name: Aggregate prospective strategy blockers
        run: |
          python3 - <<'PY'
          import json,glob,os,statistics,collections,math,datetime
          cutoff=datetime.datetime.now(datetime.timezone.utc)-datetime.timedelta(days=7)
          rows=[]; runs=[]
          for p in glob.glob('data/strategy-runs/MR1_STRATEGY_SHADOW_V1_PROSPECTIVE_*/run.json'):
              try:r=json.load(open(p))
              except:continue
              t=datetime.datetime.fromisoformat(r['started_at'].replace('Z','+00:00'))
              if t<cutoff: continue
              rid=r['run_id']; runs.append(r)
              ap=os.path.join(os.path.dirname(p),'all-markets.json')
              try: xs=json.load(open(ap))
              except: xs=[]
              for x in xs:
                  x['_run_id']=rid; x['_started_at']=r['started_at']; rows.append(x)
          def q(vals,p):
              vals=sorted(v for v in vals if isinstance(v,(int,float)) and math.isfinite(v))
              if not vals:return None
              i=(len(vals)-1)*p; lo=math.floor(i); hi=math.ceil(i)
              return vals[lo] if lo==hi else vals[lo]*(hi-i)+vals[hi]*(i-lo)
          status=collections.Counter(x.get('status') for x in rows)
          reasons=collections.Counter(y for x in rows for y in (x.get('reasons') or []))
          by_market={}
          for m in ['AH','OU']:
              xs=[x for x in rows if x.get('market')==m]
              by_market[m]={
                'n':len(xs),
                'status':dict(collections.Counter(x.get('status') for x in xs)),
                'reasons':dict(collections.Counter(y for x in xs for y in (x.get('reasons') or []))),
                'ev':{'p10':q([x.get('EV') for x in xs],.1),'p50':q([x.get('EV') for x in xs],.5),'p90':q([x.get('EV') for x in xs],.9),'max':max([x.get('EV') for x in xs if isinstance(x.get('EV'),(int,float))],default=None)},
                'abs_residual':{'p50':q([abs(x.get('residual')) for x in xs if isinstance(x.get('residual'),(int,float))],.5),'p90':q([abs(x.get('residual')) for x in xs if isinstance(x.get('residual'),(int,float))],.9),'max':max([abs(x.get('residual')) for x in xs if isinstance(x.get('residual'),(int,float))],default=None)},
                'worst_case_ev':{'p50':q([((x.get('uncertainty')or{}).get('worst_case_EV')) for x in xs],.5),'p90':q([((x.get('uncertainty')or{}).get('worst_case_EV')) for x in xs],.9),'max':max([((x.get('uncertainty')or{}).get('worst_case_EV')) for x in xs if isinstance((x.get('uncertainty')or{}).get('worst_case_EV'),(int,float))],default=None)},
                'quality':dict(collections.Counter((x.get('data_quality')or{}).get('team_state') for x in xs))
              }
          gates=['TEAM_STATE_LOW','STALE_MARKET_QUOTE','AH_OU_TIMESTAMP_SKEW','EV_BELOW_3_PERCENT','RESIDUAL_BELOW_MINIMUM','UNCERTAINTY_STRESS_FAILED']
          near=[]
          for x in rows:
              rs=set(x.get('reasons') or [])
              if x.get('status')!='SHADOW_CANDIDATE' and len(rs)<=3:
                  near.append({'run':x['_run_id'],'match_id':x.get('match_id'),'league':x.get('league'),'match':x.get('match'),'market':x.get('market'),'status':x.get('status'),'EV':x.get('EV'),'residual':x.get('residual'),'quality':(x.get('data_quality')or{}).get('team_state'),'freshness':x.get('market_freshness_minutes'),'skew':x.get('AH_OU_skew_minutes'),'worst_case_EV':(x.get('uncertainty')or{}).get('worst_case_EV'),'reasons':list(rs)})
          near=sorted(near,key=lambda x:(x['EV'] if isinstance(x['EV'],(int,float)) else -9),reverse=True)[:30]
          # Counterfactual single-gate removal: rows whose only listed failure is that gate, plus WATCH/PASS semantics.
          only_gate={g:0 for g in gates}
          combos=collections.Counter()
          for x in rows:
              rs=tuple(sorted(set(x.get('reasons') or [])))
              combos[rs]+=1
              for g in gates:
                  if set(rs)=={g}: only_gate[g]+=1
          out={
            'window_days':7,'runs':len(runs),'rows':len(rows),
            'status':dict(status),'reasons':dict(reasons),'by_market':by_market,
            'only_failure_gate':only_gate,
            'top_reason_combinations':[{'reasons':list(k),'n':v} for k,v in combos.most_common(20)],
            'near_misses':near,
            'run_candidate_counts':collections.Counter(r.get('shadow_candidates',0) for r in runs),
            'total_candidates':sum(r.get('shadow_candidates',0) for r in runs),
            'total_watchlist':sum(r.get('watchlist',0) for r in runs),
            'total_data_insufficient':sum(r.get('data_insufficient',0) for r in runs)
          }
          print('MR1_BLOCKER_AUDIT='+json.dumps(out,ensure_ascii=False,separators=(',',':')))
          PY
