name: MR1 OU T1 reverse validation

on:
  push:
    paths:
      - '.github/workflows/mr1-ou-t1-reverse-validation.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ljm198964-alt/mr1-shadow
          ref: master
          fetch-depth: 0
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node v6-ou-t1-reverse-validation.js
      - name: Persist result
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- data/mr1-v6-cross-market/ou-t1-reverse-validation
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Validate MR1 V6 OU T1 reverse with closing market'
          git pull --rebase origin master
          git push origin HEAD:master
