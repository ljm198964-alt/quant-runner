name: MR1 history gap audit once
on:
  push:
    paths:
      - '.github/workflows/mr1-history-gap-audit-once.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ljm198964-alt/mr1-shadow
          ref: master
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
      - name: Classify missing team-state history gaps
        run: |
          python3 - <<'PY'
          import json,glob,os,collections
          def load(p,d=None):
              try:return json.load(open(p))
              except:return d
          # Aggregate every collected league-history match by league name and team id.
          league_matches=collections.Counter(); league_teams=collections.defaultdict(set); team_any=set()
          for p in glob.glob('data/raw/league-history*.json'):
              x=load(p,{})
              for bucket in (x.get('leagues') or {}).values():
                  for m in bucket.get('matches') or []:
                      league=str(m.get('l') or 'UNKNOWN')
                      league_matches[league]+=1
                      for k in ('h_id','a_id'):
                          if m.get(k) is not None:
                              tid=str(m[k]);league_teams[league].add(tid);team_any.add(tid)
          fixtures=load('data/prospective-market/shadow-v23/fixtures.json',{})
          missing_matches={}
          for p in glob.glob('data/strategy-runs/*/all-markets.json'):
              if 'PROSPECTIVE_' not in p: continue
              for r in load(p,[]):
                  if 'MISSING_REQUIRED_TEAM_FEATURES' not in (r.get('reasons') or []): continue
                  mid=str(r.get('match_id'));f=fixtures.get(mid,{})
                  missing_matches[mid]={'league':r.get('league') or f.get('league'),'home_id':str(f.get('home_team_id')) if f.get('home_team_id') is not None else None,'away_id':str(f.get('away_team_id')) if f.get('away_team_id') is not None else None}
          cats=collections.Counter(); byleague=collections.Counter(); examples=collections.defaultdict(list)
          for mid,x in missing_matches.items():
              lg=x['league'] or 'UNKNOWN'; h=x['home_id'];a=x['away_id']
              if league_matches[lg]==0: cat='LEAGUE_HISTORY_NOT_COLLECTED'
              elif not h or not a: cat='FIXTURE_TEAM_ID_MISSING'
              else:
                  hp=h in league_teams[lg];ap=a in league_teams[lg]
                  if hp and ap: cat='LEAGUE_PRESENT_BOTH_TEAMS_PRESENT'
                  elif hp or ap: cat='LEAGUE_PRESENT_ONE_TEAM_MISSING'
                  else: cat='LEAGUE_PRESENT_BOTH_TEAMS_MISSING'
              cats[cat]+=1;byleague[(lg,cat)]+=1
              if len(examples[cat])<8:examples[cat].append({'match_id':mid,'league':lg,'home_id':h,'away_id':a,'history_matches_in_league':league_matches[lg]})
          out={
            'unique_missing_matches':len(missing_matches),
            'classification':cats,
            'top_league_category_pairs':[{'league':k[0],'category':k[1],'matches':v,'history_rows':league_matches[k[0]],'history_team_ids':len(league_teams[k[0]])} for k,v in byleague.most_common(25)],
            'examples':examples,
            'collected_leagues':len(league_matches),
            'collected_unique_team_ids':len(team_any)
          }
          print(json.dumps(out,ensure_ascii=False,default=lambda x:dict(x),indent=2))
          PY
