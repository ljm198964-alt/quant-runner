name: MR1 V6 forward settlement research

on:
  push:
    paths:
      - '.github/workflows/mr1-v6-forward-settlement.yml'

permissions:
  contents: read

jobs:
  settle:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout private MR1
        uses: actions/checkout@v4
        with:
          repository: ljm198964-alt/mr1-shadow
          ref: master
          fetch-depth: 0
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run V6 saved-result settlement
        run: node v6-cross-market-settlement.js
      - name: Persist research result only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- data/mr1-v6-cross-market/settlement
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Settle MR1 V6 forward research observations'
          git pull --rebase origin master
          git push origin HEAD:master
