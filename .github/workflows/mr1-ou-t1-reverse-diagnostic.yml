name: MR1 OU T1 reverse diagnostic

on:
  push:
    paths:
      - '.github/workflows/mr1-ou-t1-reverse-diagnostic.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ljm198964-alt/mr1-shadow
          ref: master
          fetch-depth: 0
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run and persist diagnostic
        shell: bash
        run: |
          set +e
          node v6-ou-t1-reverse-validation.js > /tmp/ou.log 2>&1
          rc=$?
          set -e
          mkdir -p data/mr1-v6-cross-market/ou-t1-reverse-validation
          python - "$rc" <<'PY'
          import json,sys,pathlib
          rc=int(sys.argv[1])
          log=pathlib.Path('/tmp/ou.log').read_text(errors='replace')[-12000:]
          pathlib.Path('data/mr1-v6-cross-market/ou-t1-reverse-validation/diagnostic.json').write_text(
              json.dumps({"rc":rc,"log":log},ensure_ascii=False,indent=2)+"\n")
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- data/mr1-v6-cross-market/ou-t1-reverse-validation
          git commit -m 'Record MR1 OU T1 reverse diagnostic'
          git pull --rebase origin master
          git push origin HEAD:master
          test "$rc" -eq 0
