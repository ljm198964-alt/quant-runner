name: M3 Forward Schedule Watchdog
on:
  workflow_dispatch:
  schedule:
    - cron: '15,45 * * * *'
permissions:
  actions: write
  contents: read
concurrency:
  group: m3-forward-schedule-watchdog
  cancel-in-progress: false
jobs:
  detect-and-recover:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Detect missing Beijing 06:00 and 12:00 windows and request recovery
        uses: actions/github-script@v7
        with:
          script: |
            const owner=context.repo.owner,repo=context.repo.repo;
            const now=Date.now(), hour=3600000;
            const runs=await github.paginate(github.rest.actions.listWorkflowRuns,{
              owner,repo,workflow_id:'m3-totalcorner-forward-ev.yml',per_page:100
            },response=>response.data);
            // Every Beijing 06:00 and 12:00 is UTC 22:00 previous day / 04:00 today.
            // Recovery is intentionally late (90m) to allow normal GitHub scheduling delay.
            for(let day=0;day<2;day++){
              const midnight=new Date(now);
              midnight.setUTCHours(0,0,0,0);
              midnight.setUTCDate(midnight.getUTCDate()-day);
              for(const hourUtc of [4,22]){
                const slot=midnight.getTime()+hourUtc*hour;
                if(now-slot<90*60000||now-slot>18*hour)continue;
                const existing=runs.some(r=>{
                  const t=Date.parse(r.created_at);
                  // Treat any scheduled/manual execution in this slot's 6-hour window
                  // as evidence of execution, not necessarily success.
                  return t>=slot&&t<slot+6*hour;
                });
                if(existing){
                  core.info('M3 slot '+new Date(slot).toISOString()+' has a recorded run');
                  continue;
                }
                // Watchdog can re-run every 30 min. A dispatched run should appear
                // in the API on the next check; use a unique concurrency group for watchdog.
                core.warning('M3 missing slot '+new Date(slot).toISOString()+'; dispatching recovery');
                await github.rest.actions.createWorkflowDispatch({
                  owner,repo,workflow_id:'m3-totalcorner-forward-ev.yml',ref:'main'
                });
                // One recovery per watchdog invocation.
                return;
              }
            }
            core.info('No missing M3 schedule slot eligible for recovery');
