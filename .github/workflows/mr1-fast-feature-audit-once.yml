name: MR1 fast feature audit once
on:
  push:
    paths:
      - '.github/workflows/mr1-fast-feature-audit-once.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ljm198964-alt/mr1-shadow
          ref: master
          fetch-depth: 1
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
      - name: Inspect feature direction against realized score residuals
        run: |
          python3 - <<'PY'
          import json,math,statistics
          d=json.load(open('data/processed/t24-dataset.json'))
          rows=[x for x in d['rows'] if x.get('market')=='AH' and isinstance(x.get('team_state'),dict)]
          # one row per match
          seen=set(); pts=[]
          for x in rows:
              mid=str(x.get('match_id'))
              if mid in seen: continue
              seen.add(mid)
              s=x['team_state']
              vals=[s.get(k) for k in ['home_attack_rate','away_attack_rate','home_defence_rate','away_defence_rate']]
              if not all(isinstance(v,(int,float)) and math.isfinite(v) for v in vals): continue
              if not all(isinstance(x.get(k),(int,float)) for k in ['home_goals','away_goals']): continue
              # Current feature and corrected football-meaning feature.
              ha,aa,hd,ad=vals
              current=ha-ad-aa+hd
              corrected=ha+ad-aa-hd
              goal_margin=x['home_goals']-x['away_goals']
              pts.append((current,corrected,goal_margin,x.get('league')))
          def corr(a,b):
              ma=sum(a)/len(a);mb=sum(b)/len(b)
              num=sum((x-ma)*(y-mb) for x,y in zip(a,b))
              da=sum((x-ma)**2 for x in a);db=sum((y-mb)**2 for y in b)
              return num/(da*db)**.5 if da and db else None
          cur=[p[0] for p in pts]; cor=[p[1] for p in pts]; y=[p[2] for p in pts]
          # partial simple linear one-feature OOS chronological 60/20 rolling, no market prior, directional diagnostic only
          n=len(pts); split=int(n*.6)
          def slope(train_idx,which):
              X=[pts[i][which] for i in train_idx];Y=[pts[i][2] for i in train_idx]
              mx=sum(X)/len(X);my=sum(Y)/len(Y)
              den=sum((x-mx)**2 for x in X)
              return (sum((x-mx)*(yy-my) for x,yy in zip(X,Y))/den if den else 0,my,mx)
          folds=[]
          start=split; step=max(1,int(n*.1))
          while start<n:
              end=min(n,start+step)
              tr=range(0,start); te=range(start,end)
              sc,ic,mc=slope(tr,0); sn,in_,mn=slope(tr,1)
              mse_c=sum((pts[i][2]-(ic+sc*(pts[i][0]-mc)))**2 for i in te)/max(1,end-start)
              mse_n=sum((pts[i][2]-(in_+sn*(pts[i][1]-mn)))**2 for i in te)/max(1,end-start)
              folds.append({'start':start,'end':end,'current_slope':sc,'corrected_slope':sn,'current_mse':mse_c,'corrected_mse':mse_n,'corrected_better':mse_n<mse_c})
              start=end
          report=json.load(open('data/processed/rolling-evaluation-v2.json'))
          curModels=[f.get('delta_mu_model') for f in report['markets']['AH']['fold_diagnostics']]
          ouModels=[f.get('delta_tau_model') for f in report['markets']['OU']['fold_diagnostics']]
          print('MR1_FAST_FEATURE_AUDIT='+json.dumps({
            'n_complete_matches':len(pts),
            'correlation_with_realized_goal_margin':{'current_defence_sign_feature':corr(cur,y),'corrected_defence_sign_feature':corr(cor,y)},
            'directional_oos_folds':folds,
            'corrected_better_folds':sum(f['corrected_better'] for f in folds),
            'current_AH_fold_models':curModels,
            'current_OU_fold_models':ouModels,
            'current_report_joint':report.get('joint_residual_correction',{}).get('incremental_vs_market')
          },separators=(',',':')))
          PY
