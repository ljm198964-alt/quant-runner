name: TotalCorner existing credential check
on:
  push:
    paths:
      - '.github/workflows/totalcorner-auth-check-once.yml'
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read-only comparison with existing credential
        env:
          TOTALCORNER_TOKEN: ${{ secrets.TOTALCORNER_TOKEN }}
        shell: bash
        run: |
          python3 - <<'PY_AUTH_CHECK'
          """One-off read-only check. Uses an existing secret; never stores credentials."""
          import json
          import os
          import re
          import time
          from datetime import datetime, timezone
          from html.parser import HTMLParser
          from pathlib import Path
          from urllib.parse import urlencode, urljoin, urlsplit
          from urllib.request import Request, build_opener, HTTPRedirectHandler
          from urllib.error import HTTPError
          
          
          class NoRedirect(HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None
          
          
          class Page(HTMLParser):
              def __init__(self):
                  super().__init__(convert_charrefs=True)
                  self.words = []
                  self.hidden = 0
                  self.forms = []
                  self.current_form = None
                  self.match_links = set()
                  self.auth_links = set()
          
              def handle_starttag(self, tag, attrs):
                  a = dict(attrs)
                  if tag in ('script', 'style'):
                      self.hidden += 1
                  if tag == 'form':
                      action = urlsplit(urljoin('https://www.totalcorner.com/ai-picks', a.get('action', '')))
                      self.current_form = {'action_path': action.path if action.hostname == 'www.totalcorner.com' else 'OTHER_ORIGIN',
                                           'method': a.get('method', 'get').lower(), 'field_names': []}
                      self.forms.append(self.current_form)
                  if tag in ('input', 'select', 'textarea') and self.current_form is not None:
                      name = a.get('name', '')
                      if re.fullmatch(r'[A-Za-z][A-Za-z0-9_\[\].-]{0,100}', name):
                          self.current_form['field_names'].append(name)
                  if tag == 'a':
                      href = a.get('href', '')
                      if re.match(r'^/stats/[^?#]+/\d+$', href):
                          self.match_links.add(href)
                      parts = urlsplit(urljoin('https://www.totalcorner.com/ai-picks', href))
                      if parts.hostname == 'www.totalcorner.com' and re.search(r'/user/(?:login|signin|panel)', parts.path):
                          self.auth_links.add(parts.path)
          
              def handle_endtag(self, tag):
                  if tag in ('script', 'style'):
                      self.hidden = max(0, self.hidden - 1)
                  if tag == 'form':
                      self.current_form = None
          
              def handle_data(self, value):
                  if not self.hidden:
                      self.words.append(value)
          
          
          def page_summary(body):
              p = Page()
              p.feed(body)
              text = re.sub(r'\s+', ' ', ' '.join(p.words))
              locked = re.search(r'([\d,]+)\s+AI picks for upcoming and live matches are for VIP members only', text, re.I)
              counts = re.search(r'([\d,]+)\s+picks\s*[\u00b7|]\s*([\d,]+)\s+upcoming\s*[\u00b7|]\s*([\d,]+)\s+in-play\s*[\u00b7|]\s*([\d,]+)\s+finished', text, re.I)
              return {'vip_restriction_notice': bool(locked) or bool(re.search(r'upcoming and live matches.{0,60}VIP members only', text, re.I)),
                      'locked_count': int(locked[1].replace(',', '')) if locked else None,
                      'page_counts': dict(zip(('total', 'upcoming', 'live', 'finished'), (int(x.replace(',', '')) for x in counts.groups()))) if counts else None,
                      'unique_match_links': len(p.match_links), 'forms': p.forms,
                      'auth_link_paths': sorted(p.auth_links), 'login_evidence': 'NOT_TESTED_WITH_WEBSITE_SESSION'}
          
          
          def request_summary(url, kind):
              before = time.monotonic()
              req = Request(url, headers={'User-Agent': 'Mozilla/5.0', 'Accept': 'application/json' if kind == 'api' else 'text/html', 'Cache-Control': 'no-cache'})
              try:
                  try:
                      response = build_opener(NoRedirect()).open(req, timeout=25)
                  except HTTPError as exc:
                      response = exc
                  with response:
                      raw = response.read()
                      summary = {'http_status': response.code, 'elapsed_ms': round((time.monotonic() - before) * 1000),
                                 'content_type': response.headers.get_content_type()}
                  text = raw.decode('utf-8', errors='replace')
                  if kind == 'api':
                      try:
                          obj = json.loads(text)
                      except (ValueError, TypeError):
                          return {**summary, 'json_response': False}
                      if not isinstance(obj, dict):
                          return {**summary, 'json_response': True, 'expected_structure': False}
                      err = obj.get('error') or {}
                      code = err.get('code') if isinstance(err, dict) else None
                      allowed = {'TOKEN_ERROR', 'PARAM_ERROR', 'NO_PERMISSION', 'TOO_MANY_REQUEST', 'INTERNAL_SERVER_ERROR', 'UNDER_MAINTENANCE'}
                      data = obj.get('data')
                      keys = sorted({k for r in (data[:3] if isinstance(data, list) else []) if isinstance(r, dict) for k in r if re.search(r'(^|_)(?:ai|prediction|picks?)(_|$)', k, re.I)})
                      return {**summary, 'json_response': True, 'api_success': obj.get('success') in (1, True, '1'),
                              'error_code': code if code in allowed else ('OTHER_ERROR' if err else None),
                              'data_rows': len(data) if isinstance(data, list) else None, 'prediction_field_names_in_first_three_rows': keys}
                  return {**summary, **page_summary(text)}
              except Exception as exc:
                  return {'error_type': type(exc).__name__, 'elapsed_ms': round((time.monotonic() - before) * 1000)}
          
          
          def main():
              token = os.environ.get('TOTALCORNER_TOKEN', '').strip()
              result = {'started_at': datetime.now(timezone.utc).isoformat(), 'secret_available': bool(token),
                        'scope': 'READ_ONLY_AUTH_DIAGNOSTIC', 'messages_sent': 0, 'production_files_changed': False,
                        'website_token_test_note': 'Tests only whether the existing API credential is accepted on the known official AI page. This method is not documented as website authentication.'}
              if token:
                  result['documented_api'] = request_summary('https://api.totalcorner.com/v1/match/today?' + urlencode({'token': token, 'type': 'upcoming', 'columns': 'asian,goalLine'}), 'api')
                  time.sleep(3)
                  result['anonymous_ai_page'] = request_summary('https://www.totalcorner.com/ai-picks', 'web')
                  time.sleep(3)
                  result['existing_token_ai_page'] = request_summary('https://www.totalcorner.com/ai-picks?' + urlencode({'token': token}), 'web')
              result['finished_at'] = datetime.now(timezone.utc).isoformat()
              encoded = json.dumps(result, ensure_ascii=False, indent=2)
              if token:
                  encoded = encoded.replace(token, '[REDACTED]')
              out = Path('auth-diagnostic-summary')
              out.mkdir(exist_ok=True)
              (out / 'summary.json').write_text(encoded + '\n', encoding='utf-8')
              print(encoded)
          
          
          if __name__ == '__main__':
              main()
          PY_AUTH_CHECK
      - name: Save nonsensitive diagnostic summary
        uses: actions/upload-artifact@v4
        with:
          name: totalcorner-auth-diagnostic-summary
          path: auth-diagnostic-summary/summary.json
