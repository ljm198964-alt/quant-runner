name: MR1 AI reconcile diagnostic
on:
  push:
    paths:
      - '.github/workflows/mr1-ai-reconcile-diagnostic.yml'
permissions:
  contents: read
jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ljm198964-alt/mr1-shadow
          ref: master
          fetch-depth: 0
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Reconcile saved evidence
        shell: bash
        run: |
          set +e
          node src/mr1-ai-browser-reconcile.js > /tmp/reconcile.log 2>&1
          rc=$?
          set -e
          python - "$rc" <<'PY'
          import json,sys,pathlib
          rc=int(sys.argv[1])
          log=pathlib.Path('/tmp/reconcile.log').read_text(errors='replace')[-12000:]
          pathlib.Path('data/mr1-ai-browser-forward/reconcile-diagnostic.json').write_text(
              json.dumps({"rc":rc,"log":log},ensure_ascii=False,indent=2)+"\n")
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- data/mr1-ai-browser-forward
          git commit -m 'Record MR1 AI reconcile diagnostic'
          git pull --rebase origin master
          git push origin HEAD:master
          test "$rc" -eq 0
