name: MR1 research universe audit once
on:
  push:
    paths:
      - '.github/workflows/mr1-research-universe-audit-once.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ljm198964-alt/mr1-shadow
          ref: master
          fetch-depth: 1
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
      - name: Map second-tier data coverage and league IDs
        run: |
          python3 - <<'PY'
          import json,re,collections
          d=json.load(open('data/processed/t24-dataset.json'))
          f=json.load(open('data/prospective-market/shadow-v23/fixtures.json'))
          ids=collections.defaultdict(set)
          for x in f.values():
              if x.get('league') and x.get('league_id') is not None:
                  ids[x['league']].add(str(x['league_id']))
          stats=collections.defaultdict(lambda:{'rows':0,'complete':0,'missing':0})
          req=['home_recent_adjusted_goal_diff','away_recent_adjusted_goal_diff','home_attack_rate','away_attack_rate','home_defence_rate','away_defence_rate']
          for x in d['rows']:
              if x.get('market')!='AH':continue
              l=x.get('league') or 'UNKNOWN'; stats[l]['rows']+=1
              s=x.get('team_state') or {}
              ok=all(isinstance(s.get(k),(int,float)) for k in req)
              stats[l]['complete' if ok else 'missing']+=1
          pats=[
            'Championship','Eerste Divisie','Segunda','Serie B','Ligue 2','2. Bundesliga',
            'J2','Division 1','First Division','Prva Liga','Persha Liga','Super League 2',
            'Challenge League','2. Liga','Liga 2','1 Lyga','Leumit Liga'
          ]
          out=[]
          for l,s in stats.items():
              is_second=any(p.lower() in l.lower() for p in pats)
              if is_second:
                  out.append({'league':l,'league_ids':sorted(ids.get(l,[])),'rows':s['rows'],'complete':s['complete'],'missing':s['missing'],'complete_rate':s['complete']/s['rows'] if s['rows'] else None})
          out.sort(key=lambda x:(-x['missing'],x['league']))
          print('MR1_SECOND_TIER_COVERAGE='+json.dumps(out,separators=(',',':')))
          PY
