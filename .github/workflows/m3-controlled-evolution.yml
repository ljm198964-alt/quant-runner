name: M3 Independent Controlled Evolution Check
on:
  workflow_dispatch:
  schedule:
    - cron: '10 1 * * *'
permissions:
  contents: write
concurrency:
  group: m3-controlled-evolution
  cancel-in-progress: false
jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Independently gate model promotions on real settled forward fixtures
        run: |
          python -m research.m3.evolution_controller --ledger research/m3/results/totalcorner/forward_ev_ledger.jsonl --report research/m3/results/totalcorner/evolution_status.json
      - name: Evaluate rolling challenger training windows and rollback gate
        run: |
          python -m research.m3.evolution_rolling_gate --forward research/m3/results/totalcorner/forward_ev_ledger.jsonl --challengers research/m3/results/totalcorner/rolling_candidate_predictions.jsonl --registry research/m3/results/totalcorner/evolution_rolling_registry.json
      - name: Persist evidence report
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/m3/results/totalcorner/evolution_status.json research/m3/results/totalcorner/evolution_rolling_registry.json
          if ! git diff --cached --quiet; then
            git commit -m 'Persist M3 independent evolution eligibility gate'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
