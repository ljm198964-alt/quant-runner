name: Telegram Three Path Test

on:
  push:
    paths:
      - '.github/workflows/telegram-three-path-test.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout MR1 private repo
        uses: actions/checkout@v4
        with:
          repository: ljm198964-alt/mr1-shadow
          ref: master
          path: mr1
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}

      - name: Test M1 Telegram
        id: m1
        continue-on-error: true
        env:
          M1_TELEGRAM_BOT_TOKEN: ${{ secrets.M1_TELEGRAM_BOT_TOKEN }}
          M1_TELEGRAM_CHAT_ID: ${{ secrets.M1_TELEGRAM_CHAT_ID }}
        run: |
          set -euo pipefail
          if [ -z "${M1_TELEGRAM_BOT_TOKEN:-}" ] || [ -z "${M1_TELEGRAM_CHAT_ID:-}" ]; then
            echo "::error::M1_TELEGRAM_NOT_CONFIGURED"
            exit 78
          fi
          python - <<'PY'
          import json, os
          from urllib.parse import urlencode
          from urllib.request import Request, urlopen
          text="【M1】TG发送链测试"
          token=os.environ["M1_TELEGRAM_BOT_TOKEN"]
          chat=os.environ["M1_TELEGRAM_CHAT_ID"]
          req=Request(
              f"https://api.telegram.org/bot{token}/sendMessage",
              data=urlencode({"chat_id":chat,"text":text}).encode(),
              headers={"Content-Type":"application/x-www-form-urlencoded"},
          )
          with urlopen(req,timeout=20) as r:
              body=json.load(r)
          if body.get("ok") is not True:
              raise SystemExit("M1_TELEGRAM_SEND_FAILED")
          print("M1_TELEGRAM_TEST_SENT")
          PY

      - name: Test MR1 Telegram
        working-directory: mr1
        env:
          MR1_TG_BOT_TOKEN: ${{ secrets.MR1_TG_BOT_TOKEN }}
          MR1_TG_CHAT_ID: ${{ secrets.MR1_TG_CHAT_ID }}
        run: |
          node --input-type=module - <<'NODE'
          import {sendTelegram} from './src/telegram-shadow-notify.js';
          await sendTelegram('【MR1】TG发送链测试');
          console.log('MR1_TELEGRAM_TEST_SENT');
          NODE

      - name: Test MR1 AI Telegram
        working-directory: mr1
        env:
          MR1_TG_BOT_TOKEN: ${{ secrets.MR1_TG_BOT_TOKEN }}
          MR1_TG_CHAT_ID: ${{ secrets.MR1_TG_CHAT_ID }}
        run: |
          node --input-type=module - <<'NODE'
          import {sendTelegram} from './src/telegram-shadow-notify.js';
          await sendTelegram('【MR1 AI】TG发送链测试');
          console.log('MR1_AI_TELEGRAM_TEST_SENT');
          NODE
