          9Z1b
          -----END CERTIFICATE-----
          CERT
          tar -czf "$RUNNER_TEMP/verification.tar.gz" -C "$RUNNER_TEMP" verification
          openssl cms -encrypt -binary -aes-256-cbc -in "$RUNNER_TEMP/verification.tar.gz" -outform DER -out "$RUNNER_TEMP/mr1-verification.p7m" "$RUNNER_TEMP/recipient.pem"
          rm "$RUNNER_TEMP/verification.tar.gz"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mr1-exact-id-verification-sealed
          path: ${{ runner.temp }}/mr1-verification.p7m
