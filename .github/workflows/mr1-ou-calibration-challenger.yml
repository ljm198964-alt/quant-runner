name: MR1 OU calibration challenger
on:
  push:
    paths:
      - '.github/workflows/mr1-ou-calibration-challenger.yml'
permissions:
  contents: read
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ljm198964-alt/mr1-shadow
          ref: master
          fetch-depth: 0
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run challenger
        shell: bash
        run: |
          set +e
          node src/v6-ou-calibration-challenger.js > /tmp/challenger.log 2>&1
          rc=$?
          set -e
          mkdir -p data/mr1-v6-cross-market/ou-calibration-challenger
          python - "$rc" <<'PY'
          import json,sys,pathlib
          rc=int(sys.argv[1])
          log=pathlib.Path('/tmp/challenger.log').read_text(errors='replace')[-12000:]
          pathlib.Path('data/mr1-v6-cross-market/ou-calibration-challenger/diagnostic.json').write_text(
              json.dumps({"rc":rc,"log":log},ensure_ascii=False,indent=2)+"\n")
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- data/mr1-v6-cross-market/ou-calibration-challenger
          if git diff --cached --quiet; then exit "$rc"; fi
          git commit -m 'Persist MR1 OU calibration challenger result'
          git pull --rebase origin master
          git push origin HEAD:master
          exit "$rc"
