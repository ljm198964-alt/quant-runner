name: MR1 AI Local Browser Forward

on:
  workflow_dispatch:
    inputs:
      capture_path:
        description: 'New safe member-browser capture path in private MR1 repository'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: totalcorner-api-runtime
  cancel-in-progress: false

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check required secrets
        shell: bash
        env:
          PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
          TOTALCORNER_TOKEN: ${{ secrets.TOTALCORNER_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$PRIVATE_REPO_TOKEN"
          test -n "$TOTALCORNER_TOKEN"

      - name: Checkout private MR1
        uses: actions/checkout@v4
        with:
          repository: ljm198964-alt/mr1-shadow
          ref: master
          fetch-depth: 0
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}

      - name: Checkout shared Chinese football registry
        uses: actions/checkout@v4
        with:
          repository: ljm198964-alt/totalcorner-research-bridge
          ref: master
          path: external/football-display-registry
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          sparse-checkout: |
            data/football_display_names
          sparse-checkout-cone-mode: true
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Resolve only this new capture
        env:
          TOTALCORNER_TOKEN: ${{ secrets.TOTALCORNER_TOKEN }}
          CAPTURE_PATH: ${{ inputs.capture_path }}
        run: node src/mr1-ai-browser-forward.js "$CAPTURE_PATH"

      - name: Reconcile pre-kickoff browser and API evidence
        run: node src/mr1-ai-browser-reconcile.js

      - name: Gate MR1 AI formal sends on Crown-only safety tests
        run: node --test test-mr1-ai-browser-crown-only.js test-mr1-ai-browser-forward-notify.js test-crown-source.js

      - name: Deliver only this fresh MR1 AI capture
        env:
          MR1_TG_BOT_TOKEN: ${{ secrets.MR1_TG_BOT_TOKEN }}
          MR1_TG_CHAT_ID: ${{ secrets.MR1_TG_CHAT_ID }}
          CAPTURE_PATH: ${{ inputs.capture_path }}
        run: node src/mr1-ai-browser-forward-notify.js "$CAPTURE_PATH"

      - name: Verify OU V12 core
        if: always()
        continue-on-error: true
        run: node --test test-mr1-ai-ou-v12.js

      - name: Resolve OU research signals from this capture
        if: always()
        continue-on-error: true
        env:
          TOTALCORNER_TOKEN: ${{ secrets.TOTALCORNER_TOKEN }}
          CAPTURE_PATH: ${{ inputs.capture_path }}
        run: node src/mr1-ai-ou-forward-v12.js "$CAPTURE_PATH"

      - name: V13.1 research-only OU quote snapshot
        if: always()
        continue-on-error: true
        env:
          TOTALCORNER_TOKEN: ${{ secrets.TOTALCORNER_TOKEN }}
        run: node src/mr1-ai-v13-1-quote-snapshot.js

      - name: V13 read-only price evidence audit
        if: always()
        continue-on-error: true
        run: node src/mr1-ai-v13-price-audit.js

      - name: Persist isolated MR1 AI evidence and delivery receipts
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- data/mr1-ai-browser-forward data/mr1-v7-ai-picks
          if [ -d data/mr1-ai-ou-forward-v12 ]; then git add -- data/mr1-ai-ou-forward-v12; fi
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Persist new MR1 AI local-browser evidence'
          git pull --rebase origin master
          git push origin HEAD:master
