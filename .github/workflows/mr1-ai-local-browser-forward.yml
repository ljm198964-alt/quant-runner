name: MR1 AI Local Browser Forward

on:
  workflow_dispatch:
    inputs:
      capture_path:
        description: 'New safe member-browser capture path in private MR1 repository'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: totalcorner-api-runtime
  cancel-in-progress: false

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check required secrets
        shell: bash
        env:
          PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
          TOTALCORNER_TOKEN: ${{ secrets.TOTALCORNER_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$PRIVATE_REPO_TOKEN"
          test -n "$TOTALCORNER_TOKEN"
      - name: Checkout private MR1
        uses: actions/checkout@v4
        with:
          repository: ljm198964-alt/mr1-shadow
          ref: master
          fetch-depth: 0
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Resolve only this new capture without Telegram
        env:
          TOTALCORNER_TOKEN: ${{ secrets.TOTALCORNER_TOKEN }}
          CAPTURE_PATH: ${{ inputs.capture_path }}
        run: node src/mr1-ai-browser-forward.js "$CAPTURE_PATH"
      - name: Reconcile pre-kickoff browser and API evidence
        run: node src/mr1-ai-browser-reconcile.js
      - name: Persist isolated MR1 AI evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- data/mr1-ai-browser-forward
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Persist new MR1 AI local-browser evidence'
          git pull --rebase origin master
          git push origin HEAD:master
