name: M3 Fresh TotalCorner Forward EV Shadow
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/m3-totalcorner-forward-ev.yml'
      - 'research/m3/totalcorner_shadow_settle.py'
      - 'research/m3/shadow_performance_report.py'
  schedule:
    - cron: '0 22 * * *'
    - cron: '0 4 * * *'
permissions:
  contents: write
concurrency:
  group: m3-forward-ev-shadow
  cancel-in-progress: true
jobs:
  independent-forward:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned M3 model dependencies
        run: python -m pip install penaltyblog==1.13.1 pandas numpy
      - name: Inventory future TotalCorner fixtures without odds dependency
        env:
          TOTALCORNER_TOKEN: ${{ secrets.TOTALCORNER_TOKEN }}
        run: |
          python -m research.m3.future_fixture_audit \
            --output research/m3/results/totalcorner/forward_ev_ledger.jsonl \
            --max-dates 2 --run-id "$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
      - name: Persist fixture inventory before slower model and odds phases
        run: |
          python -m research.m3.persist_append_ledger --candidate research/m3/results/totalcorner/forward_ev_ledger.jsonl
      - name: Classify prospective fixture research scope using M1 and MR1 references
        run: |
          python -m research.m3.m1_mr1_scope_audit \
            --ledger research/m3/results/totalcorner/forward_ev_ledger.jsonl \
            --run-id "$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
      - name: Checkout existing M1 completed-score caches read only
        uses: actions/checkout@v4
        with:
          repository: ljm198964-alt/totalcorner-research-bridge
          ref: master
          path: upstream/existing-m1-cache
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          sparse-checkout: |
            data/m1_history_cache
          persist-credentials: false
      - name: Fit M3 on M1 cached final scores for existing M1 MR1 competitions
        env:
          TOTALCORNER_TOKEN: ${{ secrets.TOTALCORNER_TOKEN }}
        run: |
          python -m research.m3.m1_history_forward \
            --cache-dir upstream/existing-m1-cache/data/m1_history_cache \
            --ledger research/m3/results/totalcorner/forward_ev_ledger.jsonl \
            --max-dates 2 --run-id "$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
      - name: Lock one AH and one OU shadow order per M3 model forecast
        run: |
          python -m research.m3.m3_shadow_orders \
            --ledger research/m3/results/totalcorner/forward_ev_ledger.jsonl \
            --run-id "$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
      - name: Record every scanned fixture model screening disposition
        run: |
          python -m research.m3.future_fixture_model_status \
            --ledger research/m3/results/totalcorner/forward_ev_ledger.jsonl \
            --run-id "$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
      - name: Settle finished forward quote candidates without claiming formal ROI
        env:
          TOTALCORNER_TOKEN: ${{ secrets.TOTALCORNER_TOKEN }}
        run: |
          python -m research.m3.totalcorner_shadow_settle --ledger research/m3/results/totalcorner/forward_ev_ledger.jsonl
      - name: Persist append-only shadow events without rebase conflicts
        if: always()
        run: |
          python -m research.m3.persist_append_ledger --candidate research/m3/results/totalcorner/forward_ev_ledger.jsonl
      - name: Reconcile M3 shadow order performance
        if: always()
        run: |
          python -m research.m3.shadow_performance_report \
            --ledger research/m3/results/totalcorner/forward_ev_ledger.jsonl \
            --output research/m3/results/totalcorner/shadow_performance_summary.json
      - name: Archive M3 shadow performance for this run
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m3-shadow-performance-run
          path: research/m3/results/totalcorner/shadow_performance_summary.json
          if-no-files-found: error
      - name: Keep execution record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m3-fresh-totalcorner-ev-${{ github.run_id }}
          path: research/m3/results/totalcorner/forward_ev_ledger.jsonl
          retention-days: 90
          if-no-files-found: warn
