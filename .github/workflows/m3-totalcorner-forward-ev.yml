name: M3 Fresh TotalCorner Forward EV Shadow
on:
  workflow_dispatch:
  schedule:
    - cron: '0 17 * * *'
    - cron: '0 23 * * *'
permissions:
  contents: write
concurrency:
  group: m3-forward-ev-shadow
  cancel-in-progress: false
jobs:
  independent-forward:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: openfootball/football.json
          path: upstream/openfootball-football-json
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Wait for approved Beijing scan slot (scheduled runs only)
        if: github.event_name == 'schedule'
        env:
          CRON_EVENT: ${{ github.event.schedule }}
        run: python -m research.m3.wait_until_scan_slot --cron "$CRON_EVENT"
      - name: Install pinned M3 model dependencies
        run: python -m pip install penaltyblog==1.13.1 pandas numpy
      - name: Inventory every upcoming TotalCorner fixture and time-qualified Crown market
        env:
          TOTALCORNER_TOKEN: ${{ secrets.TOTALCORNER_TOKEN }}
        run: |
          python -m research.m3.future_fixture_audit \
            --output research/m3/results/totalcorner/forward_ev_ledger.jsonl \
            --max-dates 2 --run-id "$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
      - name: Capture fresh score matrices and calculate actual TotalCorner line EV
        env:
          TOTALCORNER_TOKEN: ${{ secrets.TOTALCORNER_TOKEN }}
        run: |
          python -m research.m3.totalcorner_forward_ev \
            --input-root upstream/openfootball-football-json \
            --output research/m3/results/totalcorner/forward_ev_ledger.jsonl \
            --max-dates 2 --run-id "$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
      - name: Settle finished forward quote candidates without claiming formal ROI
        env:
          TOTALCORNER_TOKEN: ${{ secrets.TOTALCORNER_TOKEN }}
        run: |
          python -m research.m3.totalcorner_shadow_settle --input-root upstream/openfootball-football-json --ledger research/m3/results/totalcorner/forward_ev_ledger.jsonl
      - name: Persist append-only shadow events without rebase conflicts
        run: |
          python -m research.m3.persist_append_ledger --candidate research/m3/results/totalcorner/forward_ev_ledger.jsonl
      - name: Keep execution record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m3-fresh-totalcorner-ev-${{ github.run_id }}
          path: research/m3/results/totalcorner/forward_ev_ledger.jsonl
          retention-days: 90
          if-no-files-found: warn
