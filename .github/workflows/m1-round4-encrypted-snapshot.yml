name: M1 round4 encrypted research snapshot
on:
  push:
    paths:
      - '.github/workflows/m1-round4-encrypted-snapshot.yml'
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Read the pinned private research data
        uses: actions/checkout@v4
        with:
          repository: ljm198964-alt/totalcorner-research-bridge
          ref: d295754f8423fce81a0b62a41e8c0a532ac67a64
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          persist-credentials: false
      - name: Encrypt source evidence without exposing private records
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/m1-recipient.pem" <<'CERT'
          -----BEGIN CERTIFICATE-----
