        uses: actions/upload-artifact@v4
        with:
          name: m1-round4-encrypted-evidence
          path: |
            ${{ runner.temp }}/m1-evidence.enc
            ${{ runner.temp }}/source-commit.txt
            ${{ runner.temp }}/plaintext-sha256.txt
