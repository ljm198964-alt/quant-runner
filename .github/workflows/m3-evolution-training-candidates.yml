name: M3 Rolling Training Challengers
on:
  workflow_dispatch:
  schedule:
    - cron: '40 2 * * 2'
permissions:
  contents: write
jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: openfootball/football.json
          path: upstream/openfootball-football-json
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install penaltyblog==1.13.1 pandas numpy
      - name: Train three independent rolling-window model challengers
        run: python -m research.m3.evolution_training_candidates --input-root upstream/openfootball-football-json --output research/m3/results/totalcorner/rolling_candidate_predictions.jsonl
      - name: Persist append-only research challenger evidence
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/m3/results/totalcorner/rolling_candidate_predictions.jsonl
          if ! git diff --cached --quiet; then
            git commit -m 'Persist M3 rolling challenger forward predictions'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: m3-rolling-candidates-${{ github.run_id }}
          path: research/m3/results/totalcorner/rolling_candidate_predictions.jsonl
          retention-days: 90
