name: MR1 Formal Result Repair
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mr1-formal-result-repair
  cancel-in-progress: false
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4
        with:
          path: runner
      - uses: actions/checkout@v4
        with:
          repository: ljm198964-alt/mr1-shadow
          ref: master
          fetch-depth: 0
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: source
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fetch verified FT for pending formal signals
        working-directory: source
        env:
          TOTALCORNER_TOKEN: ${{ secrets.TOTALCORNER_TOKEN }}
          MAX_RESULT_CHECKS: '100'
        run: |
          cp ../runner/research/mr1/harvest_formal_results.mjs ./harvest_formal_results.mjs
          sed -i "s|from './src/totalcorner-client.js'|from './src/totalcorner-client.js'|" harvest_formal_results.mjs
          node harvest_formal_results.mjs
          rm harvest_formal_results.mjs
      - name: Reconcile verified FT into formal settlement
        working-directory: source
        run: node src/v6-ah-formal-settlement.js
      - name: Persist result evidence and formal settlement
        working-directory: source
        env:
          TOTALCORNER_TOKEN: ${{ secrets.TOTALCORNER_TOKEN }}
        run: |
          echo "RUNTIME_BASE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          git config user.name mr1-formal-result-repair
          git config user.email mr1-formal-result-repair@users.noreply.github.com
          git add data/strategy-shadow-ledger/results data/mr1-v6-cross-market/formal/settled.json data/mr1-v6-cross-market/formal/performance.json
          if git diff --cached --quiet; then echo NO_NEW_RESULTS; exit 0; fi
          git commit -m "MR1 formal FT result repair ${GITHUB_RUN_ID}"
          for attempt in 1 2 3 4; do
            git fetch origin master
            if git rebase -X ours origin/master && git push origin HEAD:master; then echo STATE_PERSISTED; exit 0; fi
            git rebase --abort 2>/dev/null || true
            sleep 5
          done
          echo '::error::MR1 formal evidence persistence failed'
          exit 1
