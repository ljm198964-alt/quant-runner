name: MR1 AI Chrome extension regression
on:
  push:
    paths:
      - '.github/workflows/mr1-ai-chrome-extension-regression.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ljm198964-alt/mr1-shadow
          ref: master
          fetch-depth: 0
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Syntax check
        run: |
          node --check src/mr1-ai-extension-bridge.js
          node --check src/mr1-ai-extension-launchd.js
          node --check chrome-extension/mr1-ai/background.js
          node --check chrome-extension/mr1-ai/content.js
      - name: Regression
        run: node --test test-mr1-ai-chrome-extension.js
      - name: Persist result
        run: |
          set -euo pipefail
          printf '{\n  "status": "PASS",\n  "test": "test-mr1-ai-chrome-extension.js",\n  "telegram_real_send": false,\n  "browser_automation_used": false\n}\n' > data/mr1-ai-browser-forward/chrome-extension-regression.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/mr1-ai-browser-forward/chrome-extension-regression.json
          git commit -m 'Verify MR1 AI Chrome extension collector'
          git pull --rebase origin master
          git push origin HEAD:master
