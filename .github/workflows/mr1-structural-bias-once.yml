name: MR1 structural market bias once
on:
  push:
    paths:
      - '.github/workflows/mr1-structural-bias-once.yml'
permissions:
  contents: read
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ljm198964-alt/mr1-shadow
          ref: master
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fixed structural bias rules on historical and prospective T24
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs/promises';
          import path from 'node:path';
          import {settleCandidate,strictLine} from './src/strategy-shadow-core.js';
          const dataset=JSON.parse(await fs.readFile('data/processed/t24-dataset.json','utf8'));
          const hist=dataset.rows.filter(r=>r.market==='AH'||r.market==='OU').map(r=>({
            match_id:String(r.match_id),kickoff:r.kickoff_at,market:r.market,
            line:r.market==='AH'?strictLine(r.home_line):strictLine(r.over_line),
            home_price:Number(r.entry_home_price),away_price:Number(r.entry_away_price),
            over_price:Number(r.entry_over_price),under_price:Number(r.entry_under_price),
            hg:Number(r.home_goals),ag:Number(r.away_goals)
          })).filter(r=>r.line!==null&&Number.isInteger(r.hg)&&Number.isInteger(r.ag));

          const root='data/prospective-market/shadow-v23/snapshots';
          const resultDir='data/strategy-shadow-ledger/results';
          const prospective=[];
          for(const mid of await fs.readdir(root)){
            let s,r;try{s=JSON.parse(await fs.readFile(path.join(root,mid,'T24','snapshot.json'),'utf8'));}catch{continue;}
            try{r=JSON.parse(await fs.readFile(path.join(resultDir,mid+'.json'),'utf8'));}catch{continue;}
            if(s.classification!=='SNAPSHOT_OK'||r.status!=='FT')continue;
            for(const market of ['AH','OU']){
              const q=s[market];if(!q)continue;
              const line=strictLine(q.line);if(line===null)continue;
              prospective.push({match_id:String(mid),kickoff:s.kickoff_at,market,line,
                home_price:Number(q.home_price),away_price:Number(q.away_price),over_price:Number(q.over_price),under_price:Number(q.under_price),
                hg:Number(r.home_goals),ag:Number(r.away_goals)});
            }
          }
          const ahRules={
            HOME_ALL:r=>['home',r.line,r.home_price],
            AWAY_ALL:r=>['away',-r.line,r.away_price],
            FAVORITE_ALL:r=>r.line<0?['home',r.line,r.home_price]:r.line>0?['away',-r.line,r.away_price]:null,
            UNDERDOG_ALL:r=>r.line<0?['away',-r.line,r.away_price]:r.line>0?['home',r.line,r.home_price]:null,
            FAVORITE_SHALLOW:r=>Math.abs(r.line)>0&&Math.abs(r.line)<=.5?(r.line<0?['home',r.line,r.home_price]:['away',-r.line,r.away_price]):null,
            UNDERDOG_SHALLOW:r=>Math.abs(r.line)>0&&Math.abs(r.line)<=.5?(r.line<0?['away',-r.line,r.away_price]:['home',r.line,r.home_price]):null,
            FAVORITE_MEDIUM:r=>Math.abs(r.line)>=.75&&Math.abs(r.line)<=1.25?(r.line<0?['home',r.line,r.home_price]:['away',-r.line,r.away_price]):null,
            UNDERDOG_MEDIUM:r=>Math.abs(r.line)>=.75&&Math.abs(r.line)<=1.25?(r.line<0?['away',-r.line,r.away_price]:['home',r.line,r.home_price]):null,
            FAVORITE_DEEP:r=>Math.abs(r.line)>=1.5?(r.line<0?['home',r.line,r.home_price]:['away',-r.line,r.away_price]):null,
            UNDERDOG_DEEP:r=>Math.abs(r.line)>=1.5?(r.line<0?['away',-r.line,r.away_price]:['home',r.line,r.home_price]):null
          };
          const ouRules={
            OVER_ALL:r=>['over',r.line,r.over_price],
            UNDER_ALL:r=>['under',r.line,r.under_price],
            OVER_LOW:r=>r.line<=2.25?['over',r.line,r.over_price]:null,
            UNDER_LOW:r=>r.line<=2.25?['under',r.line,r.under_price]:null,
            OVER_STANDARD:r=>r.line>=2.5&&r.line<=2.75?['over',r.line,r.over_price]:null,
            UNDER_STANDARD:r=>r.line>=2.5&&r.line<=2.75?['under',r.line,r.under_price]:null,
            OVER_HIGH:r=>r.line>=3?['over',r.line,r.over_price]:null,
            UNDER_HIGH:r=>r.line>=3?['under',r.line,r.under_price]:null
          };
          function pnl(row,rule){
            const c=rule(row);if(!c)return null;
            const [direction,line,price]=c;if(!Number.isFinite(price)||price<=1)return null;
            return settleCandidate({market:row.market,direction,line,price},row.hg,row.ag).realized_pnl;
          }
          function summarize(rows,rule){
            const xs=rows.map(r=>pnl(r,rule)).filter(Number.isFinite);
            return {n:xs.length,pnl:xs.reduce((a,b)=>a+b,0),roi:xs.length?xs.reduce((a,b)=>a+b,0)/xs.length:null};
          }
          function blocks(rows,rule){
            const sorted=[...rows].sort((a,b)=>Date.parse(a.kickoff)-Date.parse(b.kickoff));
            const unique=[...new Set(sorted.map(x=>x.match_id))];
            const bucket=new Map(unique.map((id,i)=>[id,Math.min(4,Math.floor(i*5/unique.length))]));
            return Array.from({length:5},(_,i)=>summarize(sorted.filter(r=>bucket.get(r.match_id)===i),rule));
          }
          const out={generated_at:new Date().toISOString(),historical_matches:new Set(hist.map(x=>x.match_id)).size,prospective_complete_t24_matches:new Set(prospective.map(x=>x.match_id)).size,rules:{}};
          for(const [market,rules] of [['AH',ahRules],['OU',ouRules]]){
            out.rules[market]={};
            const H=hist.filter(x=>x.market===market),P=prospective.filter(x=>x.market===market);
            for(const [name,rule] of Object.entries(rules)){
              const h=summarize(H,rule),bl=blocks(H,rule),p=summarize(P,rule);
              out.rules[market][name]={historical:h,historical_5_chrono_blocks:bl,historical_positive_blocks:bl.filter(x=>x.roi>0).length,prospective:p};
            }
          }
          console.log(JSON.stringify(out,null,2));
          NODE
