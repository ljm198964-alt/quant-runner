# activate
name: MR1 discovery round-robin regression
on:
  push:
    paths:
      - '.github/workflows/mr1-discovery-round-robin-regression.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ljm198964-alt/mr1-shadow
          ref: master
          fetch-depth: 0
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node --check src/shadow-v23.js
      - run: node --test test-shadow-discovery-round-robin.js
