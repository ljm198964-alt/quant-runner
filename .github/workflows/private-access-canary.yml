name: Private Access Canary

on:
  push:
    paths:
      - '.github/workflows/private-access-canary.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  canary:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout MR1 private repo
        uses: actions/checkout@v4
        with:
          repository: ljm198964-alt/mr1-shadow
          ref: master
          path: mr1
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}

      - name: Checkout M1 private repo
        uses: actions/checkout@v4
        with:
          repository: ljm198964-alt/totalcorner-research-bridge
          ref: master
          path: m1
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}

      - name: Verify access
        run: |
          test -f mr1/package.json
          test -f m1/m1_live_scan.py
          echo "PRIVATE_ACCESS_OK"
