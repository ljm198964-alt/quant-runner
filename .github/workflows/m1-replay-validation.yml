name: M1 replay validation
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/m1-replay-validation.yml'
permissions:
  contents: read
jobs:
  validation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pinned research implementation
        uses: actions/checkout@v4
        with:
          repository: ljm198964-alt/totalcorner-research-bridge
          ref: 7919b23e0662433516cda3fbbee45cb1bf03c9d4
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install existing runtime dependencies
        run: pip install numpy scipy requests
      - name: Verify original model replay and existing behavior without external services
        env:
          TOTALCORNER_TOKEN: SYNTHETIC_TEST_NO_NETWORK
          TOTALCORNER_TZ_OFFSET: '8'
        run: |
          python - <<'PY'
          import contextlib, io, json, os, pathlib, unittest
          modules = ['test_m1_replay_capture', 'test_m1_immediate_delivery',
                     'test_m1_tg_live_quote', 'test_m1_formal_runtime', 'test_m1_telegram_display']
          output = io.StringIO()
          with contextlib.redirect_stdout(output), contextlib.redirect_stderr(output):
              suite = unittest.defaultTestLoader.loadTestsFromNames(modules)
              result = unittest.TextTestRunner(stream=output, verbosity=2).run(suite)
          report = {
              'source_commit': '7919b23e0662433516cda3fbbee45cb1bf03c9d4',
              'input_kind': 'synthetic_tests_only',
              'tests_run': result.testsRun,
              'failures': [{'test': t.id(), 'last_line': message.strip().splitlines()[-1]} for t,message in result.failures],
              'errors': [{'test': t.id(), 'last_line': message.strip().splitlines()[-1]} for t,message in result.errors],
              'skipped': [{'test': t.id(), 'reason': reason} for t,reason in result.skipped],
              'successful': result.wasSuccessful(),
              'provider_credentials_supplied': False,
              'messaging_credentials_supplied': False,
              'production_writes': False
          }
          text = json.dumps(report, ensure_ascii=False, indent=2)
          path = pathlib.Path(os.environ['RUNNER_TEMP']) / 'm1-replay-validation.json'
          path.write_text(text, encoding='utf-8')
          print(text)
          raise SystemExit(0 if result.wasSuccessful() else 1)
          PY
      - name: Return validation summary only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m1-replay-validation-summary
          path: ${{ runner.temp }}/m1-replay-validation.json
