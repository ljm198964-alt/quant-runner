name: MR1 web reader verification
on:
  push:
    paths: ['.github/workflows/mr1-web-structure-once.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ljm198964-alt/mr1-shadow
          ref: ae0e6d51adaac15c1493fa728e42a708aa777165
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test parser and existing contract helpers
        run: |
          mkdir -p web-check
          set -o pipefail
          node --test test-ai-page-reader.js test-v7-ai-picks.js test-v7-ai-picks-telegram.js | tee web-check/tests.txt
      - name: Read live pages without sending messages or writing production state
        env:
          TOTALCORNER_WEB_COOKIE: ${{ secrets.TOTALCORNER_WEB_COOKIE }}
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs/promises';
          import {createHash} from 'node:crypto';
          import {loadAiPages} from './src/ai-picks-page.js';
          import {summarizeAiFixtureMatching} from './src/ai-source-diagnostics.js';
          const page=await loadAiPages();
          const fixtures=JSON.parse(await fs.readFile('data/prospective-market/shadow-v23/fixtures.json','utf8'));
          const files={};
          for(const name of ['ai-picks-page.js','v7-ai-picks-core.js','v11-ai-ah-forward.js','v7-ai-picks-telegram.js']){
            const bytes=await fs.readFile('src/'+name);files[name]=createHash('sha256').update(bytes).digest('hex');
          }
          const result={generated_at:new Date().toISOString(),messages_sent:0,production_state_changed:false,
            website_session_supplied:Boolean(process.env.TOTALCORNER_WEB_COOKIE),source_access:page.source_access,
            matching:summarizeAiFixtureMatching(page.picks,fixtures),source_sha256:files};
          const encoded=JSON.stringify(result,null,2);
          if(process.env.TOTALCORNER_WEB_COOKIE&&encoded.includes(process.env.TOTALCORNER_WEB_COOKIE))throw new Error('Sensitive output prevented');
          await fs.writeFile('web-check/summary.json',encoded);console.log(encoded);
          JS
      - name: Save nonsensitive verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mr1-web-reader-verified
          path: web-check/
