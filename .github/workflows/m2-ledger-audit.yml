name: M2 Encrypted Ledger Aggregate Audit

on:
  workflow_dispatch:
  push:
    paths:
      - 'research/m2/persisted_audit.py'
      - '.github/workflows/m2-ledger-audit.yml'

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout latest public Runner
        uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install existing M2 encryption dependency
        run: python -m pip install cryptography
      - name: Checkout existing verified FT source
        uses: actions/checkout@v4
        with:
          repository: ljm198964-alt/totalcorner-research-bridge
          ref: master
          path: source
          persist-credentials: false
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
      - name: Audit persisted M2 aggregate (no plaintext)
        env:
          M2_LEDGER_SECRET: ${{ secrets.PRIVATE_REPO_TOKEN }}
        run: |
          python -m research.m2.persisted_audit --ledger-folder research/m2/encrypted_forward --verified-formal-ledger source/results/m1_formal_ledger.json --alternate-saved-ft source/research/m1-ou-crown-market-challenger-v23/forward/verified_ft.json | tee "$RUNNER_TEMP/m2-persisted-aggregate.json"
      - name: Persist privacy-safe aggregate report
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "quant-runner-m2-audit"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for i in 1 2 3; do
            git fetch origin main
            git reset --hard FETCH_HEAD
            mkdir -p results
            cp "$RUNNER_TEMP/m2-persisted-aggregate.json" results/m2_persisted_aggregate_summary.json
            git add results/m2_persisted_aggregate_summary.json
            if git diff --cached --quiet; then
              echo "M2_AGGREGATE_ALREADY_CURRENT"
              exit 0
            fi
            git commit -m "Record M2 encrypted-ledger aggregate [skip ci]"
            if git push origin HEAD:main; then
              echo "M2_AGGREGATE_REPORT_COMMITTED"
              exit 0
            fi
            sleep $((i*4))
          done
          echo "::error::Aggregate report was computed but not persisted"
          exit 1

# Recompute privacy-safe aggregate against persisted independent TotalCorner FT.
