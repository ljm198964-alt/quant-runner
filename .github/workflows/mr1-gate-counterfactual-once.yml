name: MR1 gate counterfactual once
on:
  push:
    paths:
      - '.github/workflows/mr1-gate-counterfactual-once.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ljm198964-alt/mr1-shadow
          ref: master
          fetch-depth: 1
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
      - name: Counterfactual gates
        run: |
          python3 - <<'PY'
          import json,glob,os,datetime,collections,math
          cutoff=datetime.datetime.now(datetime.timezone.utc)-datetime.timedelta(days=7)
          rows=[]
          for p in glob.glob('data/strategy-runs/MR1_STRATEGY_SHADOW_V1_PROSPECTIVE_*/run.json'):
              try:r=json.load(open(p))
              except:continue
              if datetime.datetime.fromisoformat(r['started_at'].replace('Z','+00:00'))<cutoff:continue
              try:xs=json.load(open(os.path.join(os.path.dirname(p),'all-markets.json')))
              except:continue
              for x in xs:
                  if isinstance(x.get('EV'),(int,float)) and isinstance(x.get('residual'),(int,float)):
                      rows.append(x)
          def goodq(x): return (x.get('data_quality')or{}).get('team_state') in ('HIGH','MEDIUM')
          def evok(x): return x['EV']>=.03
          def resok(x): return abs(x['residual']) >= (.10 if x['market']=='AH' else .15)
          def uncok(x): return bool((x.get('uncertainty')or{}).get('passed'))
          def timeok(x): return x.get('market_freshness_minutes',1e9)<=30 and x.get('AH_OU_skew_minutes',1e9)<=10
          defs={
            'existing_all_gates':lambda x:goodq(x) and evok(x) and resok(x) and uncok(x) and timeok(x),
            'remove_last_change_time_gates':lambda x:goodq(x) and evok(x) and resok(x) and uncok(x),
            'remove_uncertainty_only':lambda x:goodq(x) and evok(x) and resok(x) and timeok(x),
            'remove_time_and_uncertainty':lambda x:goodq(x) and evok(x) and resok(x),
            'quality_and_positive_ev':lambda x:goodq(x) and x['EV']>0,
          }
          counts={k:sum(f(x) for x in rows) for k,f in defs.items()}
          bym={m:{k:sum(f(x) for x in rows if x['market']==m) for k,f in defs.items()} for m in ('AH','OU')}
          # unique match-market: whether any observation in window satisfies scenario
          groups=collections.defaultdict(list)
          for x in rows:groups[(x['match_id'],x['market'])].append(x)
          unique={k:sum(any(f(x) for x in xs) for xs in groups.values()) for k,f in defs.items()}
          uniquebym={m:{k:sum(any(f(x) for x in xs) for (mid,mm),xs in groups.items() if mm==m) for k,f in defs.items()} for m in ('AH','OU')}
          # Best would-be entries under time+uncertainty removed.
          picks=[]
          for (mid,m),xs in groups.items():
              eligible=[x for x in xs if defs['remove_time_and_uncertainty'](x)]
              if not eligible:continue
              x=max(eligible,key=lambda z:z['EV'])
              picks.append({a:x.get(a) for a in ['match_id','league','match','market','direction','line','price','EV','residual','market_freshness_minutes','AH_OU_skew_minutes']}|{'quality':(x.get('data_quality')or{}).get('team_state'),'worst_case_EV':(x.get('uncertainty')or{}).get('worst_case_EV')})
          picks=sorted(picks,key=lambda x:x['EV'],reverse=True)
          # Missing features root by league from null-EV rows.
          missing=collections.Counter()
          for p in glob.glob('data/strategy-runs/MR1_STRATEGY_SHADOW_V1_PROSPECTIVE_*/run.json'):
              try:r=json.load(open(p))
              except:continue
              if datetime.datetime.fromisoformat(r['started_at'].replace('Z','+00:00'))<cutoff:continue
              try:xs=json.load(open(os.path.join(os.path.dirname(p),'all-markets.json')))
              except:continue
              for x in xs:
                  if 'MISSING_REQUIRED_TEAM_FEATURES' in (x.get('reasons') or []): missing[x.get('league')]+=1
          out={'rows_with_model_eval':len(rows),'unique_match_market':len(groups),'counts':counts,'by_market':bym,'unique':unique,'unique_by_market':uniquebym,'would_be_entries':picks[:30],'missing_feature_leagues':missing.most_common(20)}
          print('MR1_GATE_CF='+json.dumps(out,ensure_ascii=False,separators=(',',':')))
          PY
