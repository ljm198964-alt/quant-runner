name: TotalCorner Chinese Name Readonly Probe
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/mr1-totalcorner-zh-probe.yml'
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ljm198964-alt/mr1-shadow
          ref: master
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Read provider names without changing profile
        env:
          TOTALCORNER_TOKEN: ${{ secrets.TOTALCORNER_TOKEN }}
        run: |
          node --input-type=module <<'JS'
          import {TotalCornerReadOnlyClient} from './src/totalcorner-client.js';
          const client=new TotalCornerReadOnlyClient({token:process.env.TOTALCORNER_TOKEN,requestsPerMinute:12,maxRetries:1});
          const date=new Date().toISOString().slice(0,10);
          const response=await client.schedule(date,1);
          const rows=Array.isArray(response.body?.data)?response.body.data:(response.body?.data?.matches||[]);
          const sample=rows.slice(0,15).map(x=>({id:x.id??x.match_id,league:x.l??x.league,home:x.h??x.home,away:x.a??x.away,start:x.start}));
          const han=/[\u3400-\u9fff]/u;
          console.log(JSON.stringify({probe:'TOTALCORNER_ACCOUNT_LANGUAGE_READONLY',date,sample_count:sample.length,chinese_count:sample.filter(x=>[x.league,x.home,x.away].some(v=>han.test(String(v??'')))).length,sample},null,2));
          JS
