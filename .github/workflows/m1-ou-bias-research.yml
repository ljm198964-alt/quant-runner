name: M1 OU Bias Research

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/m1-ou-bias-research.yml'

permissions:
  contents: read

concurrency:
  group: m1-ou-bias-research
  cancel-in-progress: false

jobs:
  study:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check repository access
        shell: bash
        env:
          PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
        run: test -n "$PRIVATE_REPO_TOKEN"

      - name: Checkout M1 research repo
        uses: actions/checkout@v4
        with:
          repository: ljm198964-alt/totalcorner-research-bridge
          ref: master
          fetch-depth: 0
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Regression check independent-fixture OU analysis
        run: python -m unittest -v test_m1_ou_bias_v2

      - name: Analyze existing settled archive without API requests
        run: python m1_ou_bias_v2.py

      - name: Validate market anchor comparison
        run: python -m unittest -v test_m1_ou_market_anchor_v3

      - name: Compare M1 OU with market line on independent holdout
        run: python m1_ou_market_anchor_v3.py

      - name: Verify archived strategy-version changepoint analysis
        run: python -m unittest -v test_m1_ou_policy_changepoint_v4

      - name: Audit each fixture against its actual saved M1 scan policy
        run: python m1_ou_policy_changepoint_v4.py

      - name: Verify same-snapshot old-versus-V2 policy replay
        run: python -m unittest -v test_m1_ou_counterfactual_scope_v5

      - name: Replay archived identical fixture quotes through historical selection gates
        run: python m1_ou_counterfactual_scope_v5.py

      - name: Verify market-neutral Poisson benchmark calculations
        run: python -m unittest -v test_m1_ou_market_distribution_v6

      - name: Compare same-time archived Asian OU odds and model expected total
        run: python m1_ou_market_distribution_v6.py

      - name: Check goal-tail calibration research
        run: python -m unittest -v test_m1_ou_goal_tail_v7

      - name: Analyze low/high goal-tail probabilities
        run: python m1_ou_goal_tail_v7.py

      - name: Verify exact historical M1 negative-binomial scoring
        run: python -m unittest -v test_m1_ou_exact_distribution_v8

      - name: Audit M1 native dispersion against market goal distribution
        run: python m1_ou_exact_distribution_v8.py

      - name: V9 matchday-cluster regression tests
        run: python -m unittest -v test_m1_ou_matchday_cluster_v9

      - name: Study low-goal clusters with independent-match null
        run: python m1_ou_matchday_cluster_v9.py

      - name: V10 whole-matchday split and frozen fusion tests
        run: python -m unittest -v test_m1_ou_day_block_fusion_v10

      - name: Evaluate historical M1 OU versus market-only on unseen whole days
        run: python m1_ou_day_block_fusion_v10.py

      - name: Checkout existing MR1 settled-score evidence only
        uses: actions/checkout@v4
        with:
          repository: ljm198964-alt/mr1-shadow
          ref: master
          path: external/mr1-ou-evidence
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          sparse-checkout: |
            data/mr1-v6-cross-market/settlement/settled-observations.json
            data/mr1-ai-browser-forward/settlement/settled.json
            data/mr1-ai-ou-forward-v12/settled.json
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: V11 cross-repository result integrity tests
        run: python -m unittest -v test_m1_ou_cross_archive_results_v11

      - name: Recover additional M1 OU final scores from MR1 saved evidence
        run: python m1_ou_cross_archive_results_v11.py

      - name: Persist research report only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- results/m1_ou_bias_v2_latest.json results/m1_ou_market_anchor_v3_latest.json results/m1_ou_policy_changepoint_v4_latest.json results/m1_ou_counterfactual_scope_v5_latest.json results/m1_ou_market_distribution_v6_latest.json results/m1_ou_goal_tail_v7_latest.json results/m1_ou_exact_distribution_v8_latest.json results/m1_ou_matchday_cluster_v9_latest.json results/m1_ou_day_block_fusion_v10_latest.json results/m1_ou_cross_archive_results_v11_latest.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Update M1 OU independent-fixture bias study'
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin master
            if git push origin HEAD:master; then exit 0; fi
          done
          exit 1
