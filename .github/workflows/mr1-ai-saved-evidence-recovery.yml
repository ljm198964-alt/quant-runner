name: MR1 AI saved-evidence recovery
on:
  push:
    paths:
      - '.github/workflows/mr1-ai-saved-evidence-recovery.yml'
permissions:
  contents: read
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ljm198964-alt/mr1-shadow
          ref: master
          fetch-depth: 0
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Syntax check
        run: node --check src/mr1-ai-browser-reconcile.js
      - name: Reconcile saved evidence only
        run: node src/mr1-ai-browser-reconcile.js
      - name: Resolve current capture path
        shell: bash
        run: |
          CAPTURE_PATH="$(node -e "console.log(require('./data/mr1-ai-browser-forward/runtime-status.json').capture_path)")"
          echo "CAPTURE_PATH=$CAPTURE_PATH" >> "$GITHUB_ENV"
      - name: Deliver still-future recovered MR1 AI signals
        env:
          MR1_TG_BOT_TOKEN: ${{ secrets.MR1_TG_BOT_TOKEN }}
          MR1_TG_CHAT_ID: ${{ secrets.MR1_TG_CHAT_ID }}
        run: node src/mr1-ai-browser-forward-notify.js "$CAPTURE_PATH"
      - name: Persist recovery evidence and receipts
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- data/mr1-ai-browser-forward data/mr1-v7-ai-picks
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Recover MR1 AI identities from saved evidence'
          git pull --rebase origin master
          git push origin HEAD:master
