name: M1 TG Historical Chinese Name Repair
# Re-run existing history-only Chinese display correction against latest shared registry.
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/m1-tg-history-name-repair.yml'

permissions:
  contents: read

jobs:
  edit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout M1 and shared football registry
        uses: actions/checkout@v4
        with:
          repository: ljm198964-alt/totalcorner-research-bridge
          ref: master
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Correct names only in existing M1 Telegram messages
        env:
          M1_TELEGRAM_BOT_TOKEN: ${{ secrets.M1_TELEGRAM_BOT_TOKEN }}
          M1_TELEGRAM_CHAT_ID: ${{ secrets.M1_TELEGRAM_CHAT_ID }}
        run: python ops/m1_telegram_display_repair.py
      - name: Upload edit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m1-tg-historical-display-report
          path: results/m1_telegram_display_repair.json
          if-no-files-found: ignore
