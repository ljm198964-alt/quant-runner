name: MR1 target coverage audit once
on:
  push:
    paths:
      - '.github/workflows/mr1-target-coverage-audit-once.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ljm198964-alt/mr1-shadow
          ref: master
          fetch-depth: 1
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
      - name: Audit target history coverage
        run: |
          python3 - <<'PY'
          import json,glob,collections,os
          # Historical backfill batches
          batches=[]
          for p in sorted(glob.glob('data/raw/league-history-batch-research-universe-*.json')):
            try:d=json.load(open(p))
            except Exception: continue
            batches.append({
              'file':os.path.basename(p),
              'collected_at':d.get('collected_at'),
              'leagues':{str(k):{'name':v.get('name'),'matches':len(v.get('matches') or []),'pages':v.get('pages_fetched'),'has_next':bool(v.get('pagination_next'))} for k,v in (d.get('leagues') or {}).items()}
            })
          # T24 feature completeness by league.
          d=json.load(open('data/processed/t24-dataset.json'))
          req=['home_recent_adjusted_goal_diff','away_recent_adjusted_goal_diff','home_attack_rate','away_attack_rate','home_defence_rate','away_defence_rate']
          stats={}
          for r in d['rows']:
            # one row per market; count unique match using AH only
            if r.get('market')!='AH': continue
            l=r.get('league')
            s=stats.setdefault(l,{'matches':0,'complete':0})
            s['matches']+=1
            st=r.get('team_state') or {}
            if all(isinstance(st.get(k),(int,float)) for k in req): s['complete']+=1
          for s in stats.values(): s['complete_rate']=s['complete']/s['matches'] if s['matches'] else None
          targets=[
            'Spain Segunda','Netherlands Eerste Divisie','Japan J2-League','England Championship','France Ligue 2','Italy Serie B','Germany Bundesliga II',
            'Brazil Serie B','Argentina Primera Division','Sweden Superettan','Norway Division 1','Portugal Segunda Liga','Austria 2. Liga','South Korea K League 2',
            'China Division 1','Saudi Arabia Division 1','Lithuania 1 Lyga','Egypt Division 2','Israel Leumit Liga','Czechia 2. Liga','Iceland 1 Deild',
            'Türkiye 1 Lig','Croatia 1.NL','Bulgaria Second League','Republic of Ireland First Division','Latvia 1. Liga','Finland Ykkosliiga',
            'Poland I Liga','Slovenia 2. SNL','Switzerland Challenge League','Hungary NB II','Georgia First League','Scotland Championship',
            'Belgium First Division B','Montenegro Druga Liga','Romania Liga II','Northern Ireland Championship','Cyprus Division 2','North Macedonia Second League',
            'Ukraine Persha Liga','Kosovo Division 1','Andorra Second Division'
          ]
          target={l:stats.get(l,{'matches':0,'complete':0,'complete_rate':None}) for l in targets}
          print('TARGET_COVERAGE='+json.dumps({'batches':batches,'target':target},separators=(',',':')))
          PY
