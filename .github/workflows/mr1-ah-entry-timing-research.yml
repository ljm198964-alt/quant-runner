name: MR1 AH entry timing research
on:
  push:
    paths:
      - '.github/workflows/mr1-ah-entry-timing-research.yml'
permissions:
  contents: read
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ljm198964-alt/mr1-shadow
          ref: master
          fetch-depth: 0
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node --check src/v6-ah-entry-timing-research.js
      - run: node src/v6-ah-entry-timing-research.js
      - name: Persist research
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/mr1-v6-cross-market/ah-entry-timing-research
          git commit -m 'Run MR1 AH entry timing research'
          git pull --rebase origin master
          git push origin HEAD:master
