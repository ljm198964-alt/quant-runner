name: MR1 target history backfill batch 3
on:
  push:
    paths:
      - '.github/workflows/mr1-target-history-backfill-b3.yml'
permissions:
  contents: read
concurrency:
  group: totalcorner-api-runtime
  cancel-in-progress: false
jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ljm198964-alt/mr1-shadow
          ref: master
          fetch-depth: 0
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Backfill low-depth high-frequency target leagues
        env:
          TOTALCORNER_TOKEN: ${{ secrets.TOTALCORNER_TOKEN }}
          MR1_HISTORY_TARGETS_JSON: '{"15":"Spain Segunda","10989":"Republic of Ireland First Division","355":"Slovakia 2. Liga","417":"Egypt Division 2"}'
          MR1_HISTORY_MAX_PAGES: '12'
        run: node src/backfill-research-universe-history.js
      - name: Persist evidence and history facts
        run: |
          set -euo pipefail
          git config user.name 'mr1-history-backfill'
          git config user.email 'mr1-history-backfill@users.noreply.github.com'
          git add -- data/research-universe-history-v1 data/raw/league-history-batch-research-universe-*.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Backfill MR1 target-universe history batch 3"
          git fetch origin master
          git rebase origin/master
          git push origin HEAD:master
