name: MR1 AI confidence floor regression
on:
  push:
    paths:
      - '.github/workflows/mr1-ai-confidence-floor-regression.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ljm198964-alt/mr1-shadow
          ref: master
          fetch-depth: 0
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Syntax
        run: |
          node --check src/mr1-ai-formal-scope.js
          node --check src/mr1-ai-browser-forward-notify.js
      - name: Regression
        run: |
          node --test test-mr1-ai-formal-scope.js
          node --test test-mr1-ai-browser-forward-notify.js
      - name: Persist
        run: |
          set -euo pipefail
          printf '{\n  "status": "PASS",\n  "minimum_ai_confidence": 50,\n  "telegram_real_send": false\n}\n' > data/mr1-ai-browser-forward/confidence-floor-regression.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/mr1-ai-browser-forward/confidence-floor-regression.json
          git commit -m 'Verify MR1 AI confidence floor'
          git pull --rebase origin master
          git push origin HEAD:master
