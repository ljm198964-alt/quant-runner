name: MR1 timing fix verify once
on:
  push:
    paths:
      - '.github/workflows/mr1-timing-fix-verify-once.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ljm198964-alt/mr1-shadow
          ref: master
          fetch-depth: 1
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Regression
        run: |
          npm run check
          node --test test-mr1-fetch-timing.js test-strategy-shadow-v1.js test-shadow-v23.js test-v3-runtime-orchestration.js test-v3-runtime-batches.js
      - name: Re-evaluate known T3 snapshot with fixed timing semantics
        run: |
          mkdir -p /tmp/mr1-manifest
          cat > /tmp/mr1-manifest/inputs.json <<'JSON'
          {"inputs":[{"key":"201317147/T3","snapshot_path":"data/prospective-market/shadow-v23/snapshots/201317147/T3/snapshot.json"}]}
          JSON
          MR1_SHADOW_BATCH_ID=TIMING_FIX_VERIFY node src/run-strategy-shadow-v1.js --snapshot-input-list /tmp/mr1-manifest/inputs.json
          python3 - <<'PY'
          import json
          p='data/strategy-runs/MR1_STRATEGY_SHADOW_V1_PROSPECTIVE_TIMING_FIX_VERIFY/all-markets.json'
          x=json.load(open(p))
          print('TIMING_FIX_RESULT='+json.dumps([{
            'market':r['market'],'status':r['status'],'reasons':r['reasons'],
            'market_freshness_minutes':r.get('market_freshness_minutes'),
            'market_last_change_age_minutes':r.get('market_last_change_age_minutes'),
            'AH_OU_skew_minutes':r.get('AH_OU_skew_minutes'),
            'AH_OU_last_change_skew_minutes':r.get('AH_OU_last_change_skew_minutes'),
            'EV':r.get('EV'),'residual':r.get('residual'),
            'worst_case_EV':(r.get('uncertainty') or {}).get('worst_case_EV')
          } for r in x],separators=(',',':')))
          PY
