name: M3 Price Movement Research
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/m3-price-movement-research.yml'
      - 'research/m3/price_movement_research.py'
permissions:
  contents: read
jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Analyze observed TotalCorner quote changes
        run: |
          python -m research.m3.price_movement_research \
            --ledger research/m3/results/totalcorner/forward_ev_ledger.jsonl \
            --output research/m3/results/totalcorner/price_movement_research.json
      - name: Archive price movement observations
        uses: actions/upload-artifact@v4
        with:
          name: m3-price-movement-research
          path: research/m3/results/totalcorner/price_movement_research.json
          if-no-files-found: error
