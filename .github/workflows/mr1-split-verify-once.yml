name: MR1 split architecture verify once
on:
  push:
    paths:
      - '.github/workflows/mr1-split-verify-once.yml'
permissions:
  contents: read
concurrency:
  group: totalcorner-api-runtime
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ljm198964-alt/mr1-shadow
          ref: master
          fetch-depth: 0
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Syntax and regression
        run: |
          npm run check
          node --test test-ai-exact-id.js test-v7-ai-picks.js test-v7-ai-picks-telegram.js test-shadow-v23.js test-strategy-shadow-v1.js
          node test-v3-runtime-orchestration.js
          node test-v3-runtime-batches.js
      - name: Verify MR1 API-only runtime
        env:
          TOTALCORNER_TOKEN: ${{ secrets.TOTALCORNER_TOKEN }}
        run: node src/github-shadow-runtime.js
      - name: Verify MR1 AI source read only
        env:
          TOTALCORNER_WEB_COOKIE: ${{ secrets.TOTALCORNER_WEB_COOKIE }}
        run: |
          node --input-type=module <<'NODE'
          import {loadAiPages} from './src/ai-picks-page.js';
          const x=await loadAiPages();
          console.log(JSON.stringify({
            access_status:x.source_access?.access_status,
            pages:x.source_access?.pages?.map(p=>({url:p.source_url,status:p.access_status,http:p.http_status,parsed:p.parsed_picks||0})),
            picks:x.picks?.length||0,
            ah:x.picks?.filter(p=>p.AH).length||0,
            telegram_sent:0
          }));
          NODE
