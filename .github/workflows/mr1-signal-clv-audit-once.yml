name: MR1 signal CLV audit once
on:
  push:
    paths:
      - '.github/workflows/mr1-signal-clv-audit-once.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ljm198964-alt/mr1-shadow
          ref: master
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Evaluate early MR1 contracts against T0.5 market-implied distribution
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs/promises';
          import path from 'node:path';
          import {fitMarketImpliedDistribution,sideStateProbabilities} from './src/market-implied-v2.js';
          import {expectedValue} from './src/metrics.js';
          import {strictLine} from './src/strategy-shadow-core.js';
          const root='data/prospective-market/shadow-v23';
          const spec=JSON.parse(await fs.readFile('config/validation-spec.json','utf8'));
          const config=JSON.parse(await fs.readFile('config/strategy-shadow-v1.json','utf8'));
          const o=spec.market_prior.optimizer;
          const optimizer={gridMin:o.grid_min,gridMax:o.grid_max,gridStep:o.grid_step,lowerBound:o.lower_bound,upperBound:o.upper_bound,refinementSteps:o.refinement_steps};
          const files=(await fs.readdir('data/strategy-shadow-ledger/late-horizon-research/records')).filter(x=>x.endsWith('.json'));
          const closeCache=new Map();
          async function closing(matchId){
            if(closeCache.has(matchId)) return closeCache.get(matchId);
            let s;try{s=JSON.parse(await fs.readFile(path.join(root,'snapshots',matchId,'T0.5','snapshot.json'),'utf8'));}catch{closeCache.set(matchId,null);return null;}
            if(s.classification!=='SNAPSHOT_OK'||!s.AH||!s.OU){closeCache.set(matchId,null);return null;}
            const ah=strictLine(s.AH.line),ou=strictLine(s.OU.line);
            if(ah===null||ou===null){closeCache.set(matchId,null);return null;}
            const fit=fitMarketImpliedDistribution({
              ah:{home_line:ah,away_line:-ah,home_price:Number(s.AH.home_price),away_price:Number(s.AH.away_price)},
              ou:{over_line:ou,under_line:ou,over_price:Number(s.OU.over_price),under_price:Number(s.OU.under_price)},
              maxGoals:config.maximum_goals_per_team,optimizer
            });
            const out=fit.status==='ok'?fit.score_distribution:null;closeCache.set(matchId,out);return out;
          }
          const returns=price=>({full_win:price-1,half_win:(price-1)/2,push:0,half_loss:-0.5,full_loss:-1});
          const rows=[];
          for(const name of files){
            const r=JSON.parse(await fs.readFile(path.join('data/strategy-shadow-ledger/late-horizon-research/records',name),'utf8'));
            if(!['T24','T18','T12','T6','T3','T1'].includes(r.horizon)||!['AH','OU'].includes(r.market))continue;
            if(!Number.isFinite(Number(r.EV))||!Number.isFinite(Number(r.line))||!Number.isFinite(Number(r.price))||Number(r.price)<=1)continue;
            const dist=await closing(String(r.match_id));if(!dist)continue;
            const p=sideStateProbabilities(dist,r.market,Number(r.line),r.direction);
            const clv=expectedValue(p,{price:Number(r.price)},returns(Number(r.price)));
            rows.push({...r,clv});
          }
          const avg=x=>x.length?x.reduce((a,b)=>a+b,0)/x.length:null;
          const summarize=xs=>({
            n:xs.length,
            mean_EV:avg(xs.map(x=>Number(x.EV))),
            mean_CLV:avg(xs.map(x=>Number(x.clv))),
            median_CLV:xs.length?[...xs].map(x=>Number(x.clv)).sort((a,b)=>a-b)[Math.floor((xs.length-1)/2)]:null,
            positive_CLV_rate:xs.length?xs.filter(x=>Number(x.clv)>0).length/xs.length:null
          });
          const groups={};
          for(const market of ['AH','OU']){
            const m=rows.filter(x=>x.market===market);
            groups[market]={
              all:summarize(m),
              EV_positive:summarize(m.filter(x=>x.EV>0)),
              EV_ge_3pct:summarize(m.filter(x=>x.EV>=.03)),
              residual_gate:summarize(m.filter(x=>Math.abs(x.residual)>= (market==='AH'?.10:.15))),
              EV_and_residual:summarize(m.filter(x=>x.EV>=.03&&Math.abs(x.residual)>=(market==='AH'?.10:.15))),
              EV_residual_stress:summarize(m.filter(x=>x.EV>=.03&&Math.abs(x.residual)>=(market==='AH'?.10:.15)&&x.worst_case_EV>=0)),
              high_or_medium_quality:summarize(m.filter(x=>['HIGH','MEDIUM'].includes(x.team_state_quality))),
              full_model_non_time_gates:summarize(m.filter(x=>x.EV>=.03&&Math.abs(x.residual)>=(market==='AH'?.10:.15)&&x.worst_case_EV>=0&&['HIGH','MEDIUM'].includes(x.team_state_quality)))
            };
            groups[market].by_horizon=Object.fromEntries(['T24','T18','T12','T6','T3','T1'].map(h=>[h,summarize(m.filter(x=>x.horizon===h))]));
          }
          console.log(JSON.stringify({generated_at:new Date().toISOString(),rows:rows.length,definition:'CLV = expected net return of original MR1 side/line/price under T0.5 market-implied score distribution',groups},null,2));
          NODE
