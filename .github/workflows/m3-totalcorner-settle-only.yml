name: M3 Verified FT Shadow Settlement Only
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: m3-settlement-only
  cancel-in-progress: false
jobs:
  settle:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: openfootball/football.json
          path: upstream/openfootball-football-json
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned research model dependencies
        run: python -m pip install penaltyblog==1.13.1 pandas numpy
      - name: Settle existing saved M3 candidates only
        env:
          TOTALCORNER_TOKEN: ${{ secrets.TOTALCORNER_TOKEN }}
        run: |
          python -m research.m3.totalcorner_shadow_settle \
            --ledger research/m3/results/totalcorner/forward_ev_ledger.jsonl
      - name: Persist append-only shadow events without rebase conflicts
        run: |
          python -m research.m3.persist_append_ledger --candidate research/m3/results/totalcorner/forward_ev_ledger.jsonl
      - name: Archive result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m3-settlement-${{ github.run_id }}
          path: research/m3/results/totalcorner/forward_ev_ledger.jsonl
          retention-days: 90
