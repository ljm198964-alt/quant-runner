name: M3 Verified FT Shadow Settlement Only
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: m3-settlement-only
  cancel-in-progress: false
jobs:
  settle:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: openfootball/football.json
          path: upstream/openfootball-football-json
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned research model dependencies
        run: python -m pip install penaltyblog==1.13.1 pandas numpy
      - name: Settle existing saved M3 candidates only
        env:
          TOTALCORNER_TOKEN: ${{ secrets.TOTALCORNER_TOKEN }}
        run: |
          python -m research.m3.totalcorner_shadow_settle \
            --input-root upstream/openfootball-football-json \
            --ledger research/m3/results/totalcorner/forward_ev_ledger.jsonl
      - name: Persist append-only verified results
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/m3/results/totalcorner/forward_ev_ledger.jsonl
          if ! git diff --cached --quiet; then
            git commit -m 'Persist M3 verified shadow settlements'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Archive result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m3-settlement-${{ github.run_id }}
          path: research/m3/results/totalcorner/forward_ev_ledger.jsonl
          retention-days: 90
