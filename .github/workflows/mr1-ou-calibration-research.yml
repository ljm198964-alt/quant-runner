# retrigger calibration research
name: MR1 OU calibration research
on:
  push:
    paths:
      - '.github/workflows/mr1-ou-calibration-research.yml'
permissions:
  contents: read
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ljm198964-alt/mr1-shadow
          ref: master
          fetch-depth: 0
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run OU calibration research
        run: node src/v6-ou-calibration-research.js
      - name: Persist research only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- data/mr1-v6-cross-market/ou-calibration-research
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Analyze MR1 OU cross-market calibration bias'
          git pull --rebase origin master
          git push origin HEAD:master